<!DOCTYPE html>
<html lang="hi">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#ffffff">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
          content="default">

    <meta name="apple-mobile-web-app-title"
          content="STDD College">

    <title>STDD College</title>

    <link rel="manifest" href="./manifest.json">

    <link rel="icon"
          href="./images/app-icon-192.png.jpeg">

    <link rel="apple-touch-icon"
          href="./images/app-icon-192.png.jpeg">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 28px 18px;

            font-family:
                Arial,
                "Noto Sans Devanagari",
                sans-serif;

            background:

                linear-gradient(
                    180deg,
                    #ff9933 0%,
                    #ff9933 33%,
                    #ffffff 33%,
                    #ffffff 67%,
                    #138808 67%,
                    #138808 100%
                );

            overflow-x: hidden;
        }


        /* Main White Card */

        .install-card {

            width: 100%;

            max-width: 430px;

            min-height: 570px;

            background: #ffffff;

            border-radius: 30px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: flex-start;

            padding:

                55px 25px
                55px 25px;

            box-shadow:

                0 18px 45px
                rgba(0, 0, 0, 0.22);

            position: relative;

            overflow: hidden;
        }


        /* Small Tricolor Top Line */

        .top-line {

            position: absolute;

            top: 0;

            left: 0;

            width: 100%;

            height: 7px;

            background:

                linear-gradient(
                    90deg,
                    #ff9933 0%,
                    #ff9933 33%,
                    #ffffff 33%,
                    #ffffff 66%,
                    #138808 66%,
                    #138808 100%
                );
        }


        /* Logo */

        .college-logo {

            width: 105px;

            height: 105px;

            object-fit: cover;

            border-radius: 23px;

            display: block;

            margin-bottom: 35px;

            box-shadow:

                0 8px 20px
                rgba(0, 0, 0, 0.20);
        }


        /* College Name */

        .college-name {

            font-size: 32px;

            font-weight: 800;

            color: #0d47a1;

            text-align: center;

            letter-spacing: 0.3px;

            margin-bottom: 55px;
        }


        /* Install Button */

        .install-button {

            width: 100%;

            max-width: 330px;

            min-height: 64px;

            border: none;

            border-radius: 18px;

            cursor: pointer;

            color: #ffffff;

            font-size: 25px;

            font-weight: 800;

            font-family:
                Arial,
                "Noto Sans Devanagari",
                sans-serif;

            letter-spacing: 0.5px;

            background:

                linear-gradient(
                    180deg,
                    #ff9933 0%,
                    #ff9933 48%,
                    #138808 52%,
                    #138808 100%
                );

            box-shadow:

                0 9px 20px
                rgba(0, 0, 0, 0.25);

            border: 3px solid #ffffff;

            outline: 2px solid rgba(13, 71, 161, 0.15);

            transition:

                transform 0.15s ease,

                box-shadow 0.15s ease,

                opacity 0.2s ease;
        }


        .install-button:active {

            transform: scale(0.96);

            box-shadow:

                0 4px 10px
                rgba(0, 0, 0, 0.20);
        }


        .install-button:hover {

            box-shadow:

                0 12px 25px
                rgba(0, 0, 0, 0.28);
        }


        .install-button:disabled {

            cursor: default;

            opacity: 0.75;

            transform: none;
        }


        /* Download Icon */

        .install-icon {

            display: inline-block;

            font-size: 25px;

            margin-right: 9px;

            vertical-align: middle;
        }


        /* Status */

        .status {

            margin-top: 22px;

            text-align: center;

            font-size: 14px;

            line-height: 1.5;

            color: #555;

            min-height: 22px;

            max-width: 330px;
        }


        /* Mobile */

        @media (max-width: 480px) {

            body {

                padding: 18px 14px;
            }


            .install-card {

                min-height: 550px;

                padding:

                    48px 20px
                    48px 20px;

                border-radius: 27px;
            }


            .college-logo {

                width: 100px;

                height: 100px;

                margin-bottom: 32px;
            }


            .college-name {

                font-size: 29px;

                margin-bottom: 50px;
            }


            .install-button {

                max-width: 315px;

                min-height: 62px;

                font-size: 23px;
            }
        }


        @media (max-width: 360px) {

            .install-card {

                padding-top: 40px;

                padding-bottom: 40px;
            }


            .college-logo {

                width: 90px;

                height: 90px;
            }


            .college-name {

                font-size: 26px;

                margin-bottom: 42px;
            }


            .install-button {

                font-size: 21px;

                min-height: 58px;
            }
        }

    </style>

</head>


<body>


    <div class="install-card">

        <div class="top-line"></div>


        <!-- Existing College Logo -->

        <img
            class="college-logo"
            src="./images/app-icon-192.png.jpeg"
            alt="STDD College Logo"
        >


        <!-- College Name -->

        <div class="college-name">
            STDD कॉलेज
        </div>


        <!-- Install Button -->

        <button
            id="installButton"
            class="install-button"
            type="button"
        >

            <span class="install-icon">⬇</span>

            इंस्टॉल

        </button>


        <!-- Installation Status -->

        <div
            id="status"
            class="status"
        ></div>

    </div>



    <script>

        let deferredPrompt = null;


        const installButton =
            document.getElementById("installButton");


        const status =
            document.getElementById("status");



        /*
         * PWA Installation Prompt
         */

        window.addEventListener(
            "beforeinstallprompt",
            function(event) {

                event.preventDefault();

                deferredPrompt = event;

            }
        );



        /*
         * INSTALL Button
         */

        installButton.addEventListener(
            "click",
            async function() {


                /*
                 * Browser has not provided
                 * installation prompt.
                 */

                if (!deferredPrompt) {

                    status.textContent =
                        "ब्राउज़र के मेनू से Install App या Add to Home Screen चुनें।";

                    return;
                }


                /*
                 * Open native PWA install prompt
                 */

                deferredPrompt.prompt();


                const result =
                    await deferredPrompt.userChoice;


                if (result.outcome === "accepted") {

                    status.textContent =
                        "ऐप इंस्टॉल हो रहा है...";

                } else {

                    status.textContent =
                        "इंस्टॉलेशन रद्द कर दिया गया।";
                }


                deferredPrompt = null;

            }
        );



        /*
         * PWA Successfully Installed
         */

        window.addEventListener(
            "appinstalled",
            function() {

                status.textContent =
                    "ऐप सफलतापूर्वक इंस्टॉल हो गया।";


                installButton.innerHTML =
                    "✓ इंस्टॉल हो गया";


                installButton.disabled = true;

            }
        );



        /*
         * Existing Service Worker
         *
         * इसे replace नहीं किया जा रहा है।
         */

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                function() {

                    navigator.serviceWorker.register(
                        "./service-worker.js"
                    ).catch(function(error) {

                        console.log(
                            "Service Worker Error:",
                            error
                        );

                    });

                }
            );

        }

    </script>


</body>

</html>
