<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project File</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #e5ddd5;
    height: 100vh;
    overflow: hidden;
}

.chat-container {
    max-width: 600px;
    height: 100vh;
    margin: auto;
    background: #efeae2;
    display: flex;
    flex-direction: column;
}

.header {
    background: #075e54;
    color: white;
    padding: 15px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.header-icon {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: white;
    color: #075e54;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
}

.header h2 {
    font-size: 18px;
}

.header p {
    font-size: 12px;
    opacity: 0.9;
    margin-top: 3px;
}

.chat-box {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    background:
        radial-gradient(#d8d0c8 1px, transparent 1px);
    background-size: 18px 18px;
}

.message {
    max-width: 82%;
    padding: 10px 12px;
    margin-bottom: 10px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.45;
    word-wrap: break-word;
}

.bot {
    background: white;
    margin-right: auto;
    border-top-left-radius: 2px;
}

.user {
    background: #d9fdd3;
    margin-left: auto;
    border-top-right-radius: 2px;
}

.file-message {
    background: white;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 10px;
    max-width: 82%;
}

.file-message img {
    max-width: 100%;
    border-radius: 5px;
    margin-top: 6px;
}

.qr-box {
    text-align: center;
}

.qr-box img {
    width: 220px;
    max-width: 100%;
    border-radius: 8px;
    margin-top: 10px;
}

.download-btn {
    display: inline-block;
    background: #128c7e;
    color: white;
    text-decoration: none;
    padding: 12px 18px;
    border-radius: 7px;
    font-weight: bold;
    margin-top: 8px;
}

.input-area {
    background: #f0f0f0;
    padding: 8px;
    display: flex;
    gap: 7px;
    align-items: center;
}

.input-area input[type="text"],
.input-area input[type="tel"] {
    flex: 1;
    border: none;
    outline: none;
    border-radius: 22px;
    padding: 12px 15px;
    font-size: 14px;
}

.send-btn,
.upload-btn {
    border: none;
    cursor: pointer;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #128c7e;
    color: white;
    font-size: 18px;
}

.upload-btn {
    display: flex;
    align-items: center;
    justify-content: center;
}

input[type="file"] {
    display: none;
}

.hidden {
    display: none !important;
}

.mobile-input-box {
    display: flex;
    gap: 8px;
    margin-top: 8px;
}

.mobile-input-box input {
    flex: 1;
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

.mobile-input-box button {
    background: #128c7e;
    color: white;
    border: none;
    padding: 0 16px;
    border-radius: 6px;
    cursor: pointer;
}

.status {
    text-align: center;
    font-size: 12px;
    color: #666;
    margin: 5px 0;
}
</style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        <div class="header-icon">P</div>
        <div>
            <h2>Project File</h2>
            <p>Online Assistance</p>
        </div>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="input-area">

        <label class="upload-btn" id="uploadLabel">
            📎
            <input type="file" id="fileInput" accept="image/*">
        </label>

        <input
            type="text"
            id="messageInput"
            placeholder="Type a message..."
            autocomplete="off"
        >

        <button class="send-btn" id="sendBtn">➤</button>

    </div>

</div>

<script>

/* ==============================
   SUPABASE CONFIGURATION
================================ */

const SUPABASE_URL = "sb_publishable_gpc7KUqUIykO3WM1aCzRfg_Myo8AKyx";
const SUPABASE_ANON_KEY = "sb_publishable_gpc7KUqUIykO3WM1aCzRfg_Myo8AKyx";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* ==============================
   PROJECT SETTINGS
================================ */
const QR_CODE_URL = "https://aghizlgvrhunpuxvohep.supabase.co/storage/v1/object/public/project-qr/WhatsApp%20Image%202026-09-12%20at%204.27.06%20PM.jpeg";

const PROJECT_FILE_DOWNLOAD_LINK = "https://jharkhandvision123.github.io/shubham/student-csc.html";


/* ==============================
   VARIABLES
================================ */

const chatBox = document.getElementById("chatBox");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const fileInput = document.getElementById("fileInput");
const uploadLabel = document.getElementById("uploadLabel");

let currentStep = "start";
let admitCardUrl = "";
let paymentScreenshotUrl = "";
let mobileNumber = "";
let submissionId = null;


/* ==============================
   CHAT FUNCTIONS
================================ */

function addBotMessage(text) {
    const div = document.createElement("div");
    div.className = "message bot";
    div.innerHTML = text;
    chatBox.appendChild(div);
    scrollChat();
}

function addUserMessage(text) {
    const div = document.createElement("div");
    div.className = "message user";
    div.textContent = text;
    chatBox.appendChild(div);
    scrollChat();
}

function addImageMessage(url, label) {
    const div = document.createElement("div");
    div.className = "file-message bot";

    div.innerHTML = `
        <strong>${label}</strong>
        <img src="${url}" alt="${label}">
    `;

    chatBox.appendChild(div);
    scrollChat();
}

function scrollChat() {
    chatBox.scrollTop = chatBox.scrollHeight;
}


/* ==============================
   START MESSAGE
================================ */

addBotMessage(
    "Namaste! 👋<br><br>" +
    "Project File Service में आपका स्वागत है।<br><br>" +
    "कृपया <b>Hi</b> लिखकर भेजें।"
);


/* ==============================
   SEND MESSAGE
================================ */

sendBtn.addEventListener("click", sendMessage);

messageInput.addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
        sendMessage();
    }
});

function sendMessage() {

    const message = messageInput.value.trim();

    if (!message) return;

    addUserMessage(message);

    messageInput.value = "";

    if (currentStep === "start") {

        currentStep = "admit_card";

        setTimeout(() => {
            addBotMessage(
                "कृपया अपना <b>Admit Card का फोटो</b> भेजें। 📄"
            );
        }, 500);

        return;
    }

    if (currentStep === "mobile") {

        processMobileNumber(message);

        return;
    }
}


/* ==============================
   FILE UPLOAD
================================ */

fileInput.addEventListener("change", async function() {

    const file = this.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {
        addBotMessage("कृपया केवल Admit Card या Payment Screenshot की image भेजें।");
        return;
    }

    if (currentStep === "admit_card") {

        addUserMessage("📄 Admit Card");

        await uploadAdmitCard(file);

    } else if (currentStep === "payment") {

        addUserMessage("💳 Payment Screenshot");

        await uploadPaymentScreenshot(file);
    }

    fileInput.value = "";
});


/* ==============================
   ADMIT CARD UPLOAD
================================ */

async function uploadAdmitCard(file) {

    addBotMessage("Admit Card प्राप्त हो रहा है...");

    const fileName =
        Date.now() + "_" +
        Math.random().toString(36).substring(2) +
        "_" +
        file.name;

    const path = "admit-cards/" + fileName;

    const { error } = await supabaseClient
        .storage
        .from("project-files")
        .upload(path, file);

    if (error) {

        console.error(error);

        addBotMessage(
            "Admit Card upload नहीं हो पाया। कृपया दोबारा प्रयास करें।"
        );

        return;
    }

    const { data } = supabaseClient
        .storage
        .from("project-files")
        .getPublicUrl(path);

    admitCardUrl = data.publicUrl;

    addImageMessage(
        admitCardUrl,
        "Admit Card सफलतापूर्वक प्राप्त हुआ"
    );

    setTimeout(() => {

        currentStep = "payment";

        addBotMessage(
            "Admit Card सफलतापूर्वक प्राप्त हुआ। ✅<br><br>" +
            "अब नीचे दिए गए QR Code पर <b>₹50 Payment</b> करें " +
            "और Payment का Screenshot भेजें।"
        );

        showQR();

    }, 700);
}


/* ==============================
   QR CODE
================================ */

function showQR() {

    const div = document.createElement("div");

    div.className = "message bot qr-box";

    div.innerHTML = `
        <b>₹50 Payment करें</b><br>
        <img src="${QR_CODE_URL}" alt="Payment QR Code">
        <br>
        Payment करने के बाद<br>
        <b>Screenshot भेजें।</b>
    `;

    chatBox.appendChild(div);

    scrollChat();
}


/* ==============================
   PAYMENT SCREENSHOT
================================ */

async function uploadPaymentScreenshot(file) {

    addBotMessage("Payment Screenshot प्राप्त हो रहा है...");

    const fileName =
        Date.now() + "_" +
        Math.random().toString(36).substring(2) +
        "_" +
        file.name;

    const path = "payment-screenshots/" + fileName;

    const { error } = await supabaseClient
        .storage
        .from("project-files")
        .upload(path, file);

    if (error) {

        console.error(error);

        addBotMessage(
            "Payment Screenshot upload नहीं हो पाया। कृपया दोबारा प्रयास करें।"
        );

        return;
    }

    const { data } = supabaseClient
        .storage
        .from("project-files")
        .getPublicUrl(path);

    paymentScreenshotUrl = data.publicUrl;

    addImageMessage(
        paymentScreenshotUrl,
        "Payment Screenshot सफलतापूर्वक प्राप्त हुआ"
    );

    setTimeout(() => {

        currentStep = "mobile";

        addBotMessage(
            "Payment Screenshot प्राप्त हो गया। ✅<br><br>" +
            "अब अपना <b>10 अंकों का Mobile Number</b> भेजें।"
        );

    }, 700);
}


/* ==============================
   MOBILE NUMBER
================================ */

async function processMobileNumber(number) {

    const cleanNumber = number.replace(/\D/g, "");

    if (!/^[6-9]\d{9}$/.test(cleanNumber)) {

        addBotMessage(
            "कृपया सही 10 अंकों का Mobile Number दर्ज करें।"
        );

        return;
    }

    mobileNumber = cleanNumber;

    addBotMessage("जानकारी सुरक्षित की जा रही है...");

    const { data, error } = await supabaseClient
        .from("project_file_submissions")
        .insert([
            {
                mobile_number: mobileNumber,
                admit_card_url: admitCardUrl,
                payment_screenshot_url: paymentScreenshotUrl,
                verification_status: "pending",
                download_link: PROJECT_FILE_DOWNLOAD_LINK
            }
        ])
        .select()
        .single();

    if (error) {

        console.error(error);

        addBotMessage(
            "Submission में समस्या आई है। कृपया दोबारा प्रयास करें।"
        );

        return;
    }

    submissionId = data.id;

    addBotMessage(
        "आपकी पूरी जानकारी सफलतापूर्वक प्राप्त हो गई है। ✅<br><br>" +
        "अब आपकी जानकारी Verification के लिए भेज दी गई है।<br><br>" +
        "Verification Complete होने के बाद आपको इसी system में " +
        "Project File Download करने का विकल्प मिलेगा।"
    );

    currentStep = "waiting";

    disableInputs();

    startVerificationCheck();
}


/* ==============================
   VERIFICATION CHECK
================================ */

function startVerificationCheck() {

    if (!submissionId) return;

    const interval = setInterval(async () => {

        const { data, error } = await supabaseClient
            .from("project_file_submissions")
            .select("verification_status, download_link")
            .eq("id", submissionId)
            .single();

        if (error) {
            console.error(error);
            return;
        }

        if (data.verification_status === "done") {

            clearInterval(interval);

            addBotMessage(
                "आपका Document Verification सफल रहा। ✅<br><br>" +
                `<a class="download-btn"
                    href="${data.download_link || PROJECT_FILE_DOWNLOAD_LINK}"
                    target="_blank">
                    📥 Download Project File
                </a>`
            );

        }

        if (data.verification_status === "failed") {

            clearInterval(interval);

            addBotMessage(
                "Your document verification failed"
            );
        }

    }, 5000);
}


/* ==============================
   DISABLE INPUTS
================================ */

function disableInputs() {

    messageInput.disabled = true;
    sendBtn.disabled = true;
    fileInput.disabled = true;
    uploadLabel.style.opacity = "0.5";
}

</script>

</body>
</html>
