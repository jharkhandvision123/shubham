<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Project File</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;

        font-family: Arial, sans-serif;

        background: #f5f5f5;

        display: flex;
        justify-content: center;
        align-items: center;
    }

    .project-container {
        width: 90%;
        max-width: 500px;

        padding: 30px 20px;

        background: linear-gradient(
            135deg,
            #ff9933 0%,
            #ffffff 50%,
            #138808 100%
        );

        border-radius: 20px;

        box-shadow:
            0 8px 25px rgba(0, 0, 0, 0.18);

        text-align: center;
    }

    .project-container h1 {
        margin: 0 0 25px;

        font-size: 28px;
        font-weight: 800;

        color: #0d47a1;
    }

    .project-buttons {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .project-button {
        display: block;

        width: 100%;

        padding: 15px 20px;

        background: #ffffff;

        border-radius: 12px;

        font-size: 18px;
        font-weight: 700;

        text-decoration: none;

        color: #222;

        cursor: pointer;

        transition: 0.2s ease;
    }

    .project-button:hover {
        transform: translateY(-2px);

        box-shadow:
            0 5px 12px rgba(0, 0, 0, 0.15);
    }

    .download-button {
        border: 3px solid #ff9933;
    }

    .upload-button {
        border: 3px solid #138808;
    }

    @media (max-width: 600px) {

        .project-container {
            width: 92%;
            padding: 25px 15px;
        }

        .project-container h1 {
            font-size: 24px;
        }

        .project-button {
            font-size: 16px;
            padding: 14px 15px;
        }

    }

</style>
```

</head>

<body>

```
<main class="project-container">

    <h1>Project File</h1>


    <div class="project-buttons">


        <!-- DOWNLOAD PROJECT FILE -->

        <a
            href="https://jharkhandvision123.github.io/shubham/student-csc.html"
            class="project-button download-button"
            target="_blank"
            rel="noopener noreferrer"
        >
            Download Project File
        </a>


        <!-- UPLOAD DOCS -->

        <a
            href="https://docs.google.com/forms/d/e/1FAIpQLSeNcT5WX2iT4mMbW_aKL0kbm_pU6shS9x9OJ1mGxAX65Uk9Zg/viewform?usp=header"
            class="project-button upload-button"
            target="_blank"
            rel="noopener noreferrer"
        >
            Upload Docs
        </a>


    </div>

</main>
```

</body>

</html>
