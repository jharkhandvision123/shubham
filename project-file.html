<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Project File PDF</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;

    /* SCREEN LOCK */
    position:fixed;
    top:0;
    left:0;
    right:0;
    bottom:0;
    overscroll-behavior:none;
}

body{
    font-family:Arial, sans-serif;
    background:#e5ddd5;

    /* SCREEN LOCK */
    touch-action:none;
}

/* =========================
   MAIN CHAT CONTAINER
========================= */

.chat-container{
    width:100%;
    max-width:600px;
    height:100dvh;
    min-height:100dvh;
    margin:auto;

    display:flex;
    flex-direction:column;

    background:#efe7de;

    overflow:hidden;
}

/* =========================
   HEADER
========================= */

.chat-header{
    flex:0 0 auto;

    background:#075e54;
    color:white;

    padding:
        calc(12px + env(safe-area-inset-top))
        15px
        12px
        15px;

    font-size:18px;
    font-weight:bold;

    display:flex;
    align-items:center;
}

/* =========================
   CHAT AREA
========================= */

.chat-area{
    flex:1 1 auto;

    min-height:0;

    overflow-y:auto;
    overflow-x:hidden;

    padding:15px;

    display:flex;
    flex-direction:column;

    gap:10px;

    -webkit-overflow-scrolling:touch;

    /* CHAT AREA CAN SCROLL */
    touch-action:pan-y;
    overscroll-behavior:contain;
}

/* =========================
   MESSAGE
========================= */

.message{
    max-width:88%;

    padding:11px 13px;

    border-radius:9px;

    font-size:15px;
    line-height:1.45;

    word-wrap:break-word;
    overflow-wrap:anywhere;

    box-shadow:0 1px 1px rgba(0,0,0,0.08);
}

.bot-message{
    align-self:flex-start;

    background:white;

    border-top-left-radius:3px;
}

.user-message{
    align-self:flex-end;

    background:#d9ffc7;

    border-top-right-radius:3px;
}

/* =========================
   BUTTON
========================= */

.option-btn{
    width:100%;

    border:none;

    background:#128c7e;
    color:white;

    padding:11px 12px;

    margin-top:8px;

    border-radius:7px;

    font-size:15px;
    font-weight:bold;

    cursor:pointer;

    min-height:44px;
}

.option-btn:hover{
    background:#0d7d70;
}

.option-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* =========================
   DOWNLOAD BUTTON
========================= */

.download-btn{
    display:block;

    width:100%;
    min-height:45px;

    border:none;

    cursor:pointer;

    text-align:center;

    background:#25d366;
    color:white;

    padding:12px;

    border-radius:7px;

    font-weight:bold;
    font-size:15px;

    margin-top:10px;
}

.download-btn:hover{
    background:#20bd5a;
}

/* =========================
   FILE NAME
========================= */

.file-name{
    flex:0 0 auto;

    display:none;

    background:white;

    padding:7px 12px;

    font-size:13px;

    border-top:1px solid #ddd;

    color:#333;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

/* =========================
   INPUT AREA
========================= */

.input-area{
    flex:0 0 auto;

    min-height:62px;

    padding:
        8px
        10px
        calc(8px + env(safe-area-inset-bottom))
        10px;

    background:#f0f0f0;

    border-top:1px solid #ddd;

    display:flex;
    align-items:center;

    gap:7px;
}

/* =========================
   INPUT
========================= */

.text-input{
    flex:1;

    min-width:0;

    height:44px;

    border:none;

    outline:none;

    border-radius:22px;

    padding:0 15px;

    font-size:15px;

    background:white;
}

/* =========================
   SEND BUTTON
========================= */

.send-btn{
    flex:0 0 44px;

    width:44px;
    height:44px;

    border:none;

    border-radius:50%;

    background:#128c7e;
    color:white;

    cursor:pointer;

    font-size:18px;
}

.send-btn:hover{
    background:#0d7d70;
}

.send-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* =========================
   FILE INPUT
========================= */

.file-input{
    display:none;
}

/* =========================
   FILE BUTTON
========================= */

.file-btn{
    flex:0 0 44px;

    width:44px;
    height:44px;

    border:none;

    border-radius:50%;

    background:#ddd;

    cursor:pointer;

    font-size:18px;

    display:flex;
    align-items:center;
    justify-content:center;
}

/* =========================
   QR IMAGE
========================= */

.qr-image{
    width:220px;
    max-width:100%;

    display:block;

    margin:10px auto;

    border-radius:5px;
}

/* =========================
   MOBILE DEVICE MODE
========================= */

body.mobile-device{
    width:100%;
    height:100%;

    overflow:hidden;

    background:#efe7de;

    /* SCREEN LOCK */
    position:fixed;
}

body.mobile-device .chat-container{
    position:fixed;

    top:0;
    left:0;

    width:var(--app-width, 100vw);
    height:var(--app-height, 100vh);

    min-height:0;
    max-height:none;

    max-width:none;

    margin:0;

    overflow:hidden;
}

/* =========================
   SMALL MOBILE
========================= */

@media(max-width:420px){

    .chat-header{
        font-size:17px;
        padding-left:12px;
        padding-right:12px;
    }

    .chat-area{
        padding:10px;
    }

    .message{
        max-width:92%;
        font-size:14px;
    }

    .input-area{
        padding-left:7px;
        padding-right:7px;
    }

    .qr-image{
        width:190px;
    }
}

/* =========================
   LANDSCAPE MOBILE
========================= */

@media(max-height:520px){

    .chat-header{
        padding-top:7px;
        padding-bottom:7px;
        font-size:16px;
    }

    .chat-area{
        padding:8px;
        gap:7px;
    }

    .message{
        padding:8px 10px;
        font-size:13px;
    }

    .input-area{
        min-height:52px;
        padding-top:5px;
        padding-bottom:5px;
    }

    .text-input,
    .send-btn,
    .file-btn{
        height:38px;
    }

    .send-btn,
    .file-btn{
        width:38px;
        flex-basis:38px;
    }

    .option-btn{
        min-height:38px;
        padding:8px;
        margin-top:5px;
    }
}

/* =========================
   MOBILE DEVICE OVERRIDES
========================= */

body.mobile-device .chat-area{
    min-height:0;
    touch-action:pan-y;
    overscroll-behavior:contain;
}

body.mobile-device .input-area{
    flex-shrink:0;
}

body.mobile-device .file-name{
    flex-shrink:0;
}

/* =========================
   LOADING
========================= */

.loading{
    opacity:.7;
    font-style:italic;
}

/* =========================
   ERROR
========================= */

.error-message{
    color:#b00020;
    background:#ffe5e5;
}
</style>
</head>

<body>

<div class="chat-container">

    <div class="chat-header">
        📄 Project File
    </div>

    <div class="chat-area" id="chatArea">
    </div>

    <div class="file-name" id="fileName"></div>

    <div class="input-area">

        <label class="file-btn" id="fileButton" title="Upload File">
            📎
            <input
                type="file"
                id="fileInput"
                class="file-input"
                accept="image/*,.pdf"
            >
        </label>

        <input
            type="text"
            id="textInput"
            class="text-input"
            placeholder="Type your mobile number..."
            autocomplete="off"
        >

        <button
            type="button"
            id="sendButton"
            class="send-btn"
        >
            ➤
        </button>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   MOBILE / DESKTOP-SITE VIEWPORT FIX
========================================================= */

(function(){

    function detectMobileDevice(){

        const ua = navigator.userAgent || "";

        const normalMobile =
            /Android|iPhone|iPad|iPod|Mobile/i.test(ua);

        const touchDevice =
            navigator.maxTouchPoints &&
            navigator.maxTouchPoints > 0;

        const coarsePointer =
            window.matchMedia &&
            window.matchMedia("(pointer: coarse)").matches;

        const screenSmall =
            Math.min(
                window.screen.width || 9999,
                window.screen.height || 9999
            ) <= 1200;

        return (
            normalMobile ||
            (touchDevice && coarsePointer && screenSmall)
        );
    }


    function updateViewport(){

        const visual =
            window.visualViewport;

        let width;
        let height;

        if(visual){

            width = visual.width;
            height = visual.height;

        }else{

            width = window.innerWidth;
            height = window.innerHeight;

        }

        if(!width || width < 1){
            width = window.innerWidth;
        }

        if(!height || height < 1){
            height = window.innerHeight;
        }

        document.documentElement.style.setProperty(
            "--app-width",
            width + "px"
        );

        document.documentElement.style.setProperty(
            "--app-height",
            height + "px"
        );
    }


    if(detectMobileDevice()){
        document.body.classList.add("mobile-device");
    }


    updateViewport();


    window.addEventListener(
        "resize",
        updateViewport,
        {passive:true}
    );

    window.addEventListener(
        "orientationchange",
        function(){
            setTimeout(updateViewport,100);
            setTimeout(updateViewport,500);
        },
        {passive:true}
    );


    if(window.visualViewport){

        window.visualViewport.addEventListener(
            "resize",
            updateViewport,
            {passive:true}
        );

        window.visualViewport.addEventListener(
            "scroll",
            updateViewport,
            {passive:true}
        );
    }

})();


/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://aghizlgvrhunpuxvohep.supabase.co";

const SUPABASE_KEY =
"sb_publishable_gpc7KUqUIykO3WM1aCzRfg_Myo8AKyx";

const securityClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   CONSTANTS
========================================================= */

const PROJECT_BUCKET =
"project-files";

const QR_URL =
"https://aghizlgvrhunpuxvohep.supabase.co/storage/v1/object/public/project-qr/WhatsApp%20Image%202026-09-13%20at%204.19.01%20PM.jpeg";

const DOWNLOAD_LINK =
"https://jharkhandvision123.github.io/shubham/student-csc.html";


/* =========================================================
   VARIABLES
========================================================= */

let currentStep = "admit-card";

let admitCardFile = null;

let paymentScreenshotFile = null;

let admitCardPath = "";

let paymentScreenshotPath = "";

let currentMobileNumber = "";

let verificationTimer = null;


/* =========================================================
   ELEMENTS
========================================================= */

const chatArea =
document.getElementById("chatArea");

const textInput =
document.getElementById("textInput");

const sendButton =
document.getElementById("sendButton");

const fileInput =
document.getElementById("fileInput");

const fileName =
document.getElementById("fileName");

const fileButton =
document.getElementById("fileButton");


/* =========================================================
   MESSAGE FUNCTION
========================================================= */

function addMessage(html, type="bot"){

    const message =
    document.createElement("div");

    message.className =
    "message " +
    (type === "user"
        ? "user-message"
        : "bot-message");

    message.innerHTML = html;

    chatArea.appendChild(message);

    setTimeout(function(){

        chatArea.scrollTop =
        chatArea.scrollHeight;

    },50);

    return message;
}


/* =========================================================
   DISABLE / ENABLE INPUT
========================================================= */

function setInputEnabled(enabled){

    textInput.disabled = !enabled;
    sendButton.disabled = !enabled;
    fileInput.disabled = !enabled;

}


/* =========================================================
   INITIAL MESSAGE
========================================================= */

window.addEventListener("load",function(){

    addMessage(
        "👋 <b>Welcome!</b><br><br>" +
        "Project File बनाने के लिए सबसे पहले अपना " +
        "<b>Admit Card</b> upload करें।"
    );

    textInput.placeholder =
    "Admit Card upload करें...";

});


/* =========================================================
   FILE INPUT CHANGE
========================================================= */

fileInput.addEventListener(
    "change",
    function(){

        if(!fileInput.files || !fileInput.files[0]){
            return;
        }

        const file =
        fileInput.files[0];


        if(currentStep === "admit-card"){

            admitCardFile = file;

            fileName.style.display = "block";

            fileName.textContent =
            "📎 " + file.name;

            textInput.placeholder =
            "Send दबाकर Admit Card भेजें...";

            addMessage(
                "📎 <b>" +
                escapeHtml(file.name) +
                "</b><br>अब Send बटन दबाएँ।"
            );

        }

        else if(currentStep === "payment"){

            paymentScreenshotFile = file;

            fileName.style.display = "block";

            fileName.textContent =
            "📎 " + file.name;

            textInput.placeholder =
            "Send दबाकर Payment Screenshot भेजें...";

            addMessage(
                "📎 <b>" +
                escapeHtml(file.name) +
                "</b><br>अब Send बटन दबाएँ।"
            );
        }

    }
);


/* =========================================================
   SEND BUTTON
========================================================= */

sendButton.addEventListener(
    "click",
    sendCurrentStep
);


/* =========================================================
   ENTER KEY
========================================================= */

textInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            sendCurrentStep();
        }

    }
);


/* =========================================================
   MAIN SEND FUNCTION
========================================================= */

async function sendCurrentStep(){

    try{

        if(currentStep === "admit-card"){

            await handleAdmitCard();

        }

        else if(currentStep === "payment"){

            await handlePaymentScreenshot();

        }

        else if(currentStep === "mobile"){

            await handleMobileNumber();

        }

    }
    catch(error){

        console.error(error);

        addMessage(
            '<span class="error-message">' +
            '❌ कुछ समस्या हुई। कृपया फिर से प्रयास करें।' +
            '</span>'
        );

        setInputEnabled(true);
    }

}


/* =========================================================
   ADMIT CARD
========================================================= */

async function handleAdmitCard(){

    if(!admitCardFile){

        addMessage(
            "⚠️ कृपया पहले Admit Card upload करें।"
        );

        return;
    }


    setInputEnabled(false);

    addMessage(
        "📤 Admit Card upload हो रहा है...",
        "user"
    );


    const extension =
    getFileExtension(admitCardFile.name);

    const uniqueName =
    "admit-" +
    Date.now() +
    "-" +
    Math.random()
        .toString(36)
        .substring(2,8) +
    "." +
    extension;

    admitCardPath =
    "admit-cards/" +
    uniqueName;


    const {error} =
    await securityClient
        .storage
        .from(PROJECT_BUCKET)
        .upload(
            admitCardPath,
            admitCardFile,
            {
                cacheControl:"3600",
                upsert:false
            }
        );


    if(error){

        console.error(error);

        addMessage(
            "❌ Admit Card upload नहीं हो पाया।"
        );

        setInputEnabled(true);

        return;
    }


    addMessage(
        "✅ Admit Card successfully received."
    );


    currentStep = "payment";

    admitCardFile = null;

    fileInput.value = "";

    fileName.style.display = "none";

    textInput.value = "";

    setInputEnabled(true);

    showPaymentInstruction();
}


/* =========================================================
   PAYMENT INSTRUCTION
========================================================= */

function showPaymentInstruction(){

    addMessage(
        "💳 <b>Project File Charge: ₹50</b><br><br>" +

        "नीचे दिए गए QR Code पर ₹50 payment करें।" +

        '<img src="' +
        QR_URL +
        '" class="qr-image" alt="Payment QR">' +

        "Payment करने के बाद उसका " +
        "<b>Screenshot</b> upload करें।"
    );

    textInput.placeholder =
    "Payment Screenshot upload करें...";

}


/* =========================================================
   PAYMENT SCREENSHOT
========================================================= */

async function handlePaymentScreenshot(){

    if(!paymentScreenshotFile){

        addMessage(
            "⚠️ कृपया पहले Payment Screenshot upload करें।"
        );

        return;
    }


    setInputEnabled(false);

    addMessage(
        "📤 Payment Screenshot upload हो रहा है...",
        "user"
    );


    const extension =
    getFileExtension(paymentScreenshotFile.name);

    const uniqueName =
    "payment-" +
    Date.now() +
    "-" +
    Math.random()
        .toString(36)
        .substring(2,8) +
    "." +
    extension;

    paymentScreenshotPath =
    "payment-screenshots/" +
    uniqueName;


    const {error} =
    await securityClient
        .storage
        .from(PROJECT_BUCKET)
        .upload(
            paymentScreenshotPath,
            paymentScreenshotFile,
            {
                cacheControl:"3600",
                upsert:false
            }
        );


    if(error){

        console.error(error);

        addMessage(
            "❌ Payment Screenshot upload नहीं हो पाया।"
        );

        setInputEnabled(true);

        return;
    }


    addMessage(
        "✅ Payment Screenshot received."
    );


    currentStep = "mobile";

    paymentScreenshotFile = null;

    fileInput.value = "";

    fileName.style.display = "none";

    textInput.value = "";

    textInput.placeholder =
    "अपना Mobile Number लिखें...";

    setInputEnabled(true);


    addMessage(
        "📱 अब अपना <b>10 digit Mobile Number</b> लिखकर Send करें।"
    );

}


/* =========================================================
   MOBILE NUMBER
========================================================= */

async function handleMobileNumber(){

    const mobile =
    textInput.value.trim();


    if(!/^[0-9]{10}$/.test(mobile)){

        addMessage(
            "⚠️ कृपया सही 10 digit Mobile Number दर्ज करें।"
        );

        return;
    }


    setInputEnabled(false);


    addMessage(
        mobile,
        "user"
    );


    addMessage(
        "⏳ आपका Project File request submit हो रहा है..."
    );


    const {data,error} =
    await securityClient
        .from("project_file_submissions")
        .insert({

            mobile_number:mobile,

            admit_card_url:
            admitCardPath,

            payment_screenshot_url:
            paymentScreenshotPath,

            verification_status:
            "pending",

            download_link:
            DOWNLOAD_LINK

        })
        .select()
        .single();


    if(error){

        console.error(error);

        addMessage(
            "❌ Submission नहीं हो पाया। कृपया फिर से प्रयास करें।"
        );

        setInputEnabled(true);

        return;
    }


    currentMobileNumber =
    mobile;


    addMessage(
        "✅ <b>Submission Complete</b><br><br>" +
        "आपका Admit Card और Payment Screenshot " +
        "verification के लिए भेज दिया गया है।<br><br>" +
        "कृपया verification complete होने तक प्रतीक्षा करें।"
    );


    textInput.value = "";

    fileInput.value = "";

    fileName.style.display = "none";

    currentStep = "waiting";

    setInputEnabled(false);


    startVerificationCheck();

}


/* =========================================================
   VERIFICATION CHECK
========================================================= */

function startVerificationCheck(){

    if(verificationTimer){
        clearInterval(verificationTimer);
    }


    checkVerification();


    verificationTimer =
    setInterval(
        checkVerification,
        5000
    );

}


/* =========================================================
   CHECK STATUS
========================================================= */

async function checkVerification(){

    if(!currentMobileNumber){
        return;
    }


    const {data,error} =
    await securityClient
        .from("project_file_submissions")
        .select(
            "verification_status,download_link"
        )
        .eq(
            "mobile_number",
            currentMobileNumber
        )
        .order(
            "created_at",
            {ascending:false}
        )
        .limit(1)
        .maybeSingle();


    if(error){

        console.error(error);

        return;
    }


    if(!data){
        return;
    }


    if(data.verification_status === "done"){

        clearInterval(verificationTimer);

        showVerificationSuccess(
            data.download_link ||
            DOWNLOAD_LINK
        );

    }


    else if(
        data.verification_status === "failed"
    ){

        clearInterval(verificationTimer);

        showVerificationFailed();

    }

}


/* =========================================================
   VERIFICATION SUCCESS
========================================================= */

function showVerificationSuccess(downloadUrl){

    addMessage(
        "🎉 <b>Verification Done!</b><br><br>" +
        "आपका document verification successfully complete हो गया है।"
    );


    const message =
    addMessage(
        '<b>Project File तैयार है।</b><br>' +
        'नीचे दिए गए button पर click करके download करें।' +

        '<button type="button" ' +
        'class="download-btn" ' +
        'id="downloadProjectFileBtn">' +
        '📥 Download Project File' +
        '</button>'
    );


    const downloadButton =
    message.querySelector(
        "#downloadProjectFileBtn"
    );


    if(downloadButton){

        downloadButton.addEventListener(
            "click",
            function(){

                if(!downloadUrl){

                    alert(
                        "Download link उपलब्ध नहीं है।"
                    );

                    return;
                }


                window.open(
                    downloadUrl,
                    "_blank",
                    "noopener,noreferrer"
                );

            }
        );

    }

}


/* =========================================================
   VERIFICATION FAILED
========================================================= */

function showVerificationFailed(){

    addMessage(
        "❌ <b>Your document verification failed.</b><br><br>" +
        "कृपया सही document/payment screenshot के साथ फिर से प्रयास करें।"
    );

}


/* =========================================================
   FILE EXTENSION
========================================================= */

function getFileExtension(filename){

    const parts =
    filename.split(".");

    if(parts.length < 2){
        return "jpg";
    }

    return parts
        .pop()
        .toLowerCase()
        .replace(/[^a-z0-9]/g,"") || "jpg";

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   PREVENT ACCIDENTAL PAGE SCROLL
========================================================= */

document.addEventListener(
    "touchmove",
    function(event){

        if(
            !event.target.closest(".chat-area")
        ){
            event.preventDefault();
        }

    },
    {passive:false}
);

</script>
</script>

<script>

/* =========================================================
   PROJECT FILE CHAT HISTORY - LOCAL STORAGE
========================================================= */

(function(){

    const CHAT_HISTORY_KEY =
    "project_file_chat_history_v1";

    const PROJECT_STATE_KEY =
    "project_file_state_v1";

    let restoredHistory =
    false;

    let skipInitialWelcome =
    false;

    let activeDownloadUrl =
    "";


    /* =====================================================
       SAVE CHAT
    ===================================================== */

    function saveProjectChat(){

        try{

            const messages =
            Array.from(
                chatArea.querySelectorAll(".message")
            ).map(function(message){

                const downloadButton =
                message.querySelector(".download-btn");

                return {

                    html:
                    message.innerHTML,

                    type:
                    message.classList.contains(
                        "user-message"
                    )
                    ? "user"
                    : "bot",

                    downloadUrl:
                    downloadButton
                    ? (
                        downloadButton.dataset.downloadUrl ||
                        DOWNLOAD_LINK
                    )
                    : ""

                };

            });


            localStorage.setItem(
                CHAT_HISTORY_KEY,
                JSON.stringify(messages)
            );

        }
        catch(error){

            console.error(
                "Project chat save error:",
                error
            );

        }

    }


    /* =====================================================
       SAVE CURRENT PROCESS STATE
    ===================================================== */

    function saveProjectState(){

        try{

            localStorage.setItem(
                PROJECT_STATE_KEY,
                JSON.stringify({

                    currentStep:
                    currentStep,

                    admitCardPath:
                    admitCardPath,

                    paymentScreenshotPath:
                    paymentScreenshotPath,

                    currentMobileNumber:
                    currentMobileNumber

                })
            );

        }
        catch(error){

            console.error(
                "Project state save error:",
                error
            );

        }

    }


    /* =====================================================
       LOAD CURRENT PROCESS STATE
    ===================================================== */

    function loadProjectState(){

        try{

            const saved =
            localStorage.getItem(
                PROJECT_STATE_KEY
            );

            if(!saved){
                return;
            }

            const state =
            JSON.parse(saved);

            if(!state){
                return;
            }


            if(
                typeof state.currentStep ===
                "string"
            ){

                currentStep =
                state.currentStep;

            }


            if(
                typeof state.admitCardPath ===
                "string"
            ){

                admitCardPath =
                state.admitCardPath;

            }


            if(
                typeof state.paymentScreenshotPath ===
                "string"
            ){

                paymentScreenshotPath =
                state.paymentScreenshotPath;

            }


            if(
                typeof state.currentMobileNumber ===
                "string"
            ){

                currentMobileNumber =
                state.currentMobileNumber;

            }

        }
        catch(error){

            console.error(
                "Project state load error:",
                error
            );

        }

    }


    /* =====================================================
       RESTORE CHAT
    ===================================================== */

    function restoreProjectChat(){

        try{

            const saved =
            localStorage.getItem(
                CHAT_HISTORY_KEY
            );

            if(!saved){
                return false;
            }

            const messages =
            JSON.parse(saved);

            if(
                !Array.isArray(messages) ||
                messages.length === 0
            ){
                return false;
            }


            chatArea.innerHTML = "";


            messages.forEach(function(item){

                if(
                    !item ||
                    typeof item.html !==
                    "string"
                ){
                    return;
                }


                const message =
                document.createElement("div");


                message.className =
                "message " +
                (
                    item.type === "user"
                    ? "user-message"
                    : "bot-message"
                );


                message.innerHTML =
                item.html;


                const downloadButton =
                message.querySelector(
                    ".download-btn"
                );


                if(downloadButton){

                    downloadButton.dataset.downloadUrl =
                    item.downloadUrl ||
                    DOWNLOAD_LINK;

                    downloadButton.dataset.restored =
                    "true";

                }


                chatArea.appendChild(
                    message
                );

            });


            setTimeout(function(){

                chatArea.scrollTop =
                chatArea.scrollHeight;

            },100);


            restoredHistory =
            true;

            skipInitialWelcome =
            true;

            return true;

        }
        catch(error){

            console.error(
                "Project chat restore error:",
                error
            );

            return false;

        }

    }


    /* =====================================================
       ORIGINAL ADD MESSAGE SAVE
    ===================================================== */

    const originalAddMessage =
    addMessage;


    addMessage = function(
        html,
        type="bot"
    ){

        /*
           पुरानी Welcome message को
           refresh पर दोबारा आने से रोकना।
        */

        if(
            skipInitialWelcome &&
            html.indexOf(
                "Project File बनाने के लिए सबसे पहले अपना"
            ) !== -1
        ){

            skipInitialWelcome =
            false;

            return document.createElement(
                "div"
            );

        }


        const message =
        originalAddMessage(
            html,
            type
        );


        const downloadButton =
        message.querySelector(
            ".download-btn"
        );


        if(downloadButton){

            downloadButton.dataset.downloadUrl =
            activeDownloadUrl ||
            DOWNLOAD_LINK;

        }


        saveProjectChat();

        saveProjectState();


        return message;

    };


    /* =====================================================
       RESTORED DOWNLOAD BUTTON
    ===================================================== */

    chatArea.addEventListener(
        "click",
        function(event){

            const button =
            event.target.closest(
                ".download-btn"
            );


            if(
                !button ||
                button.dataset.restored !==
                "true"
            ){
                return;
            }


            event.preventDefault();


            const downloadUrl =
            button.dataset.downloadUrl ||
            DOWNLOAD_LINK;


            if(!downloadUrl){

                alert(
                    "Download link उपलब्ध नहीं है।"
                );

                return;
            }


            window.open(
                downloadUrl,
                "_blank",
                "noopener,noreferrer"
            );

        }
    );


    /* =====================================================
       NEW REQUEST
    ===================================================== */

    function startNewProjectRequest(){

        currentStep =
        "admit-card";

        admitCardFile =
        null;

        paymentScreenshotFile =
        null;

        admitCardPath =
        "";

        paymentScreenshotPath =
        "";

        currentMobileNumber =
        "";


        if(verificationTimer){

            clearInterval(
                verificationTimer
            );

            verificationTimer =
            null;

        }


        fileInput.value =
        "";

        textInput.value =
        "";

        fileName.style.display =
        "none";


        textInput.placeholder =
        "Admit Card upload करें...";


        setInputEnabled(
            true
        );


        saveProjectState();


        addMessage(
            "👋 <b>Welcome!</b><br><br>" +
            "Project File बनाने के लिए सबसे पहले अपना " +
            "<b>Admit Card</b> upload करें।"
        );

    }


    /* =====================================================
       VERIFICATION SUCCESS
    ===================================================== */

    const originalSuccess =
    showVerificationSuccess;


    showVerificationSuccess =
    function(downloadUrl){

        activeDownloadUrl =
        downloadUrl ||
        DOWNLOAD_LINK;


        originalSuccess(
            downloadUrl
        );


        activeDownloadUrl =
        "";


        saveProjectChat();


        startNewProjectRequest();

    };


    /* =====================================================
       VERIFICATION FAILED
    ===================================================== */

    const originalFailed =
    showVerificationFailed;


    showVerificationFailed =
    function(){

        originalFailed();


        saveProjectChat();


        startNewProjectRequest();

    };


    /* =====================================================
       SAVE AFTER ADMIT CARD
    ===================================================== */

    const originalAdmitCard =
    handleAdmitCard;


    handleAdmitCard =
    async function(){

        const result =
        await originalAdmitCard();


        saveProjectState();
        saveProjectChat();


        return result;

    };


    /* =====================================================
       SAVE AFTER PAYMENT SCREENSHOT
    ===================================================== */

    const originalPayment =
    handlePaymentScreenshot;


    handlePaymentScreenshot =
    async function(){

        const result =
        await originalPayment();


        saveProjectState();
        saveProjectChat();


        return result;

    };


    /* =====================================================
       SAVE AFTER MOBILE SUBMISSION
    ===================================================== */

    const originalMobile =
    handleMobileNumber;


    handleMobileNumber =
    async function(){

        const result =
        await originalMobile();


        saveProjectState();
        saveProjectChat();


        return result;

    };


    /* =====================================================
       RESTORE NOW
    ===================================================== */

    loadProjectState();

    restoreProjectChat();


    /* =====================================================
       APPLY RESTORED STATE AFTER PAGE LOAD
    ===================================================== */

    window.addEventListener(
        "load",
        function(){

            if(!restoredHistory){
                return;
            }


            if(
                currentStep ===
                "waiting"
            ){

                textInput.placeholder =
                "Verification होने तक प्रतीक्षा करें...";


                setInputEnabled(
                    false
                );


                if(
                    currentMobileNumber
                ){

                    startVerificationCheck();

                }

            }


            else if(
                currentStep ===
                "payment"
            ){

                textInput.placeholder =
                "Payment Screenshot upload करें...";


                setInputEnabled(
                    true
                );

            }


            else if(
                currentStep ===
                "mobile"
            ){

                textInput.placeholder =
                "अपना Mobile Number लिखें...";


                setInputEnabled(
                    true
                );

            }


            else{

                currentStep =
                "admit-card";


                textInput.placeholder =
                "Admit Card upload करें...";


                setInputEnabled(
                    true
                );

            }


            setTimeout(function(){

                chatArea.scrollTop =
                chatArea.scrollHeight;

            },150);

        }
    );


})();

</script>
