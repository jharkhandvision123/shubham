<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project File</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#e5ddd5;
    height:100vh;
    overflow:hidden;
}

.chat-container{
    width:100%;
    max-width:600px;
    height:100vh;
    margin:auto;
    background:#efeae2;
    display:flex;
    flex-direction:column;
}

/* HEADER */
.header{
    height:65px;
    background:#075e54;
    color:white;
    display:flex;
    align-items:center;
    padding:10px 15px;
    gap:12px;
    flex-shrink:0;
}

.profile{
    width:45px;
    height:45px;
    border-radius:50%;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#075e54;
    font-weight:bold;
    font-size:20px;
}

.header-info h3{
    font-size:17px;
    margin-bottom:3px;
}

.header-info p{
    font-size:12px;
    opacity:.85;
}

/* CHAT */
.chat{
    flex:1;
    overflow-y:auto;
    padding:15px 10px;
    background:
    radial-gradient(#ddd 1px,transparent 1px);
    background-size:12px 12px;
}

.message{
    max-width:85%;
    padding:10px 12px;
    border-radius:8px;
    margin-bottom:10px;
    font-size:15px;
    line-height:1.4;
    word-wrap:break-word;
}

.bot{
    background:white;
    align-self:flex-start;
    border-top-left-radius:2px;
}

.user{
    background:#d9fdd3;
    margin-left:auto;
    border-top-right-radius:2px;
}

.option-btn{
    display:block;
    width:100%;
    margin-top:8px;
    padding:11px;
    border:none;
    border-radius:7px;
    background:#128c7e;
    color:white;
    font-size:14px;
    cursor:pointer;
}

.option-btn:hover{
    background:#0b7b70;
}

.success{
    color:#087f23;
    font-weight:bold;
}

.error{
    color:#c62828;
    font-weight:bold;
}

.qr{
    width:220px;
    max-width:100%;
    display:block;
    margin:10px auto;
    border-radius:8px;
}

.download-btn{
    display:block;
    text-align:center;
    text-decoration:none;
    background:#25d366;
    color:white;
    padding:12px;
    border-radius:7px;
    font-weight:bold;
    margin-top:10px;
}

/* INPUT */
.input-area{
    min-height:62px;
    background:#f0f2f5;
    display:flex;
    align-items:center;
    padding:8px;
    gap:7px;
    flex-shrink:0;
}

.text-input{
    flex:1;
    height:45px;
    border:none;
    outline:none;
    border-radius:23px;
    padding:0 16px;
    font-size:15px;
}

.attach-btn{
    width:45px;
    height:45px;
    border:none;
    border-radius:50%;
    background:white;
    font-size:22px;
    cursor:pointer;
}

.send-btn{
    width:45px;
    height:45px;
    border:none;
    border-radius:50%;
    background:#128c7e;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.send-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.file-name{
    position:absolute;
    bottom:67px;
    left:10px;
    right:10px;
    background:white;
    padding:7px 10px;
    border-radius:6px;
    font-size:12px;
    display:none;
}

.loading{
    opacity:.7;
}
</style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        <div class="profile">JV</div>
        <div class="header-info">
            <h3>Project File</h3>
            <p>Online</p>
        </div>
    </div>

    <div class="chat" id="chat"></div>

    <div class="input-area">

        <input
            type="text"
            id="messageInput"
            class="text-input"
            placeholder="Type a message..."
            autocomplete="off"
        >

        <input
            type="file"
            id="fileInput"
            accept="image/*"
            hidden
        >

        <button
            type="button"
            class="attach-btn"
            id="attachBtn"
            title="Attach image"
        >📎</button>

        <button
            type="button"
            class="send-btn"
            id="sendBtn"
            title="Send"
        >➤</button>

    </div>

    <div id="fileName" class="file-name"></div>

</div>


<script>
(function(){

"use strict";

/* =========================================
   SUPABASE CONFIG
========================================= */

const SUPABASE_URL =
"https://aghizlgvrhunpuxvohep.supabase.co";

/*
   यहां अपना Supabase Publishable Key रखें।
*/
const SUPABASE_ANON_KEY =
"sb_publishable_gpc7KUqUIykO3WM1aCzRfg_Myo8AKyx";


/* =========================================
   OTHER SETTINGS
========================================= */

const QR_CODE_URL =
"https://aghizlgvrhunpuxvohep.supabase.co/storage/v1/object/public/project-qr/WhatsApp%20Image%202026-09-12%20at%204.27.06%20PM.jpeg";

const DOWNLOAD_LINK =
"https://jharkhandvision123.github.io/shubham/student-csc.html";


/* =========================================
   CHECK SUPABASE
========================================= */

if(!window.supabase){

    document.getElementById("chat").innerHTML = `
        <div class="message bot">
            <span class="error">
            System loading failed.
            </span><br><br>
            Please refresh the page.
        </div>
    `;

    return;
}


let supabaseClient;

try{

    supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );

}catch(error){

    console.error(error);

    document.getElementById("chat").innerHTML = `
        <div class="message bot">
            <span class="error">
            Supabase connection failed.
            </span><br><br>
            Please check the Supabase configuration.
        </div>
    `;

    return;
}


/* =========================================
   ELEMENTS
========================================= */

const chat =
document.getElementById("chat");

const messageInput =
document.getElementById("messageInput");

const sendBtn =
document.getElementById("sendBtn");

const attachBtn =
document.getElementById("attachBtn");

const fileInput =
document.getElementById("fileInput");

const fileName =
document.getElementById("fileName");


/* =========================================
   VARIABLES
========================================= */

let currentStep = "start";

let admitCardFile = null;

let paymentScreenshotFile = null;

let submissionId = null;


/* =========================================
   CHAT FUNCTIONS
========================================= */

function scrollChat(){

    chat.scrollTop = chat.scrollHeight;

}


function addMessage(text,type="bot"){

    const div =
    document.createElement("div");

    div.className =
    "message " + type;

    div.innerHTML = text;

    chat.appendChild(div);

    scrollChat();

    return div;
}


function addButton(text,callback){

    const btn =
    document.createElement("button");

    btn.type = "button";

    btn.className = "option-btn";

    btn.textContent = text;

    btn.addEventListener("click",callback);

    chat.appendChild(btn);

    scrollChat();

}


function showTyping(){

    const div =
    document.createElement("div");

    div.className =
    "message bot loading";

    div.id = "typing";

    div.textContent = "Typing...";

    chat.appendChild(div);

    scrollChat();

}


function removeTyping(){

    const typing =
    document.getElementById("typing");

    if(typing){

        typing.remove();

    }

}


/* =========================================
   START MESSAGE
========================================= */

addMessage(`
    Hi 👋<br><br>
    Welcome to <b>Project File Service</b>.<br><br>
    इस सेवा का उपयोग करने के लिए नीचे दिए गए
    संदेश में <b>Hi</b> लिखकर Send करें।
`);


/* =========================================
   SEND BUTTON
========================================= */

sendBtn.addEventListener("click",sendMessage);


/* ENTER KEY
========================================= */

messageInput.addEventListener("keydown",function(e){

    if(e.key === "Enter"){

        e.preventDefault();

        sendMessage();

    }

});


/* =========================================
   SEND MESSAGE
========================================= */

function sendMessage(){

    const text =
    messageInput.value.trim();

    if(!text){

        return;

    }

    addMessage(text,"user");

    messageInput.value = "";

    if(currentStep === "start"){

        currentStep = "admit-card";

        setTimeout(function(){

            addMessage(`
                कृपया अपना <b>Admit Card</b> फोटो भेजें।
                <br><br>
                नीचे 📎 बटन से फोटो select करें।
            `);

        },300);

        return;
    }


    if(currentStep === "mobile"){

        handleMobileNumber(text);

        return;

    }


    addMessage(`
        कृपया ऊपर दिए गए निर्देश के अनुसार
        आवश्यक जानकारी भेजें।
    `);

}


/* =========================================
   ATTACH BUTTON
========================================= */

attachBtn.addEventListener("click",function(){

    fileInput.click();

});


/* =========================================
   FILE SELECT
========================================= */

fileInput.addEventListener("change",function(){

    if(!fileInput.files.length){

        return;

    }

    const file =
    fileInput.files[0];

    fileName.style.display = "block";

    fileName.textContent =
    "Selected: " + file.name;


    if(currentStep === "admit-card"){

        admitCardFile = file;

        addMessage(
            "📎 " + file.name,
            "user"
        );

        uploadAdmitCard();

    }

    else if(currentStep === "payment"){

        paymentScreenshotFile = file;

        addMessage(
            "📎 " + file.name,
            "user"
        );

        uploadPaymentScreenshot();

    }

    else{

        addMessage(`
            अभी इस समय file upload की जरूरत नहीं है।
        `);

    }

});


/* =========================================
   UNIQUE FILE NAME
========================================= */

function createFileName(file){

    const extension =
    file.name.includes(".")
    ? file.name.split(".").pop()
    : "jpg";

    return Date.now() +
    "_" +
    Math.random().toString(36).substring(2,10) +
    "." +
    extension;

}


/* =========================================
   UPLOAD ADMIT CARD
========================================= */

async function uploadAdmitCard(){

    if(!admitCardFile){

        return;

    }

    showTyping();

    try{

        const fileNameNew =
        createFileName(admitCardFile);

        const filePath =
        "admit-cards/" + fileNameNew;


        const {error} =
        await supabaseClient
        .storage
        .from("project-files")
        .upload(
            filePath,
            admitCardFile,
            {
                cacheControl:"3600",
                upsert:false
            }
        );


        if(error){

            throw error;

        }


        removeTyping();

        currentStep = "payment";

        addMessage(`
            <span class="success">
            ✅ Admit Card received successfully.
            </span>
            <br><br>
            अब ₹50 का payment करें।
            <br><br>
            नीचे दिए गए QR Code को scan करके
            <b>₹50</b> payment करें।
            <img
                src="${QR_CODE_URL}"
                class="qr"
                alt="Payment QR Code"
            >
            Payment करने के बाद
            उसका <b>Screenshot</b> भेजें।
        `);

    }

    catch(error){

        removeTyping();

        console.error("Admit Card Upload Error:",error);

        addMessage(`
            <span class="error">
            ❌ Admit Card upload नहीं हो पाया।
            </span>
            <br><br>
            कृपया दोबारा photo select करें।
        `);

    }

}


/* =========================================
   UPLOAD PAYMENT SCREENSHOT
========================================= */

async function uploadPaymentScreenshot(){

    if(!paymentScreenshotFile){

        return;

    }

    showTyping();

    try{

        const fileNameNew =
        createFileName(paymentScreenshotFile);

        const filePath =
        "payment-screenshots/" + fileNameNew;


        const {error} =
        await supabaseClient
        .storage
        .from("project-files")
        .upload(
            filePath,
            paymentScreenshotFile,
            {
                cacheControl:"3600",
                upsert:false
            }
        );


        if(error){

            throw error;

        }


        removeTyping();

        currentStep = "mobile";

        addMessage(`
            <span class="success">
            ✅ Payment Screenshot received.
            </span>
            <br><br>
            अब अपना <b>Mobile Number</b> भेजें।
        `);

    }

    catch(error){

        removeTyping();

        console.error(
            "Payment Screenshot Upload Error:",
            error
        );

        addMessage(`
            <span class="error">
            ❌ Payment Screenshot upload नहीं हो पाया।
            </span>
            <br><br>
            कृपया screenshot दोबारा select करें।
        `);

    }

}


/* =========================================
   MOBILE NUMBER
========================================= */

async function handleMobileNumber(number){

    const mobile =
    number.replace(/\D/g,"");


    if(mobile.length !== 10){

        addMessage(`
            <span class="error">
            ❌ कृपया 10 अंकों का सही Mobile Number भेजें।
            </span>
        `);

        return;

    }


    showTyping();


    try{

        /*
          NOTE:
          अभी file URL की जगह file path database
          में रखने के लिए temporary values बनाई गई हैं।
        */

        const admitPath =
        admitCardFile
        ? "admit-cards/" + admitCardFile.name
        : "";

        const paymentPath =
        paymentScreenshotFile
        ? "payment-screenshots/" +
          paymentScreenshotFile.name
        : "";


        const {data,error} =
        await supabaseClient
        .from("project_file_submissions")
        .insert({

            mobile_number:mobile,

            admit_card_url:admitPath,

            payment_screenshot_url:paymentPath,

            verification_status:"pending",

            download_link:DOWNLOAD_LINK

        })
        .select("id")
        .single();


        if(error){

            throw error;

        }


        submissionId =
        data.id;


        removeTyping();

        currentStep = "waiting";

        addMessage(`
            <span class="success">
            ✅ आपकी submission successfully भेज दी गई है।
            </span>
            <br><br>
            📱 Mobile Number: <b>${mobile}</b>
            <br><br>
            अब आपके documents की verification की जाएगी।
            <br><br>
            कृपया प्रतीक्षा करें...
        `);


        startVerificationCheck();


    }

    catch(error){

        removeTyping();

        console.error(
            "Database Error:",
            error
        );

        addMessage(`
            <span class="error">
            ❌ Submission भेजने में समस्या हुई।
            </span>
            <br><br>
            कृपया कुछ देर बाद दोबारा प्रयास करें।
        `);

    }

}


/* =========================================
   CHECK VERIFICATION
========================================= */

let verificationTimer = null;


function startVerificationCheck(){

    if(!submissionId){

        return;

    }


    if(verificationTimer){

        clearInterval(verificationTimer);

    }


    verificationTimer =
    setInterval(
        checkVerification,
        5000
    );


    checkVerification();

}


/* =========================================
   VERIFICATION STATUS
========================================= */

async function checkVerification(){

    if(!submissionId){

        return;

    }


    try{

        const {data,error} =
        await supabaseClient
        .from("project_file_submissions")
        .select(
            "verification_status,download_link"
        )
        .eq("id",submissionId)
        .single();


        if(error){

            console.error(
                "Verification Check Error:",
                error
            );

            return;

        }


        if(data.verification_status === "done"){

            clearInterval(verificationTimer);

            currentStep = "completed";

            addMessage(`
                <span class="success">
                ✅ Document Verification Done
                </span>
                <br><br>
                आपका Project File तैयार है।
                <br><br>
                <a
                    href="${data.download_link || DOWNLOAD_LINK}"
                    target="_blank"
                    class="download-btn"
                >
                    📥 Download Project File
                </a>
            `);

        }


        else if(
            data.verification_status === "failed"
        ){

            clearInterval(verificationTimer);

            currentStep = "failed";

            addMessage(`
                <span class="error">
                ❌ Your document verification failed
                </span>
            `);

        }

    }

    catch(error){

        console.error(error);

    }

}


/* =========================================
   RESET FILE INPUT AFTER SELECTION
========================================= */

fileInput.addEventListener("click",function(){

    fileInput.value = "";

});


})();
</script>

</body>
</html>
