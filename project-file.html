<script>

/*
=========================================================
MOBILE DEVICE DETECTION

यह code "Desktop Site" ON होने पर भी मोबाइल पहचानने
की कोशिश करता है।

Chrome/Android/iPhone के mobile User-Agent में
Mobile / Android / iPhone आदि मौजूद रहते हैं।

इसलिए viewport 980px होने पर भी mobile layout
force किया जा सकेगा।
=========================================================
*/

(function(){

    try{

        const userAgent =
            navigator.userAgent ||
            navigator.vendor ||
            window.opera ||
            "";

        const isMobileUserAgent =
            /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i
            .test(userAgent);

        const isTouchDevice =
            (
                "ontouchstart" in window
            )
            ||
            (
                navigator.maxTouchPoints &&
                navigator.maxTouchPoints > 0
            );

        /*
          Mobile User-Agent सबसे reliable signal है।
        */

        if(isMobileUserAgent){

            document.body.classList.add(
                "mobile-device"
            );

        }

        /*
          कुछ browsers में User-Agent बदल सकता है।
          Touch + छोटा physical screen होने पर भी
          mobile layout लागू करें।
        */

        else if(
            isTouchDevice &&
            Math.min(
                window.screen.width,
                window.screen.height
            ) <= 600
        ){

            document.body.classList.add(
                "mobile-device"
            );

        }


        /*
          Small mobile screen
        */

        if(
            document.body.classList.contains(
                "mobile-device"
            )
        ){

            const smallestScreen =
                Math.min(
                    window.screen.width,
                    window.screen.height
                );

            if(smallestScreen <= 380){

                document.body.classList.add(
                    "mobile-small"
                );

            }

        }

        /*
          Landscape detection
        */

        function updateOrientation(){

            if(
                !document.body.classList.contains(
                    "mobile-device"
                )
            ){

                return;

            }

            const width =
                window.innerWidth;

            const height =
                window.innerHeight;

            if(width > height){

                document.body.classList.add(
                    "mobile-landscape"
                );

            }
            else{

                document.body.classList.remove(
                    "mobile-landscape"
                );

            }

        }

        updateOrientation();

        window.addEventListener(
            "resize",
            updateOrientation
        );

        window.addEventListener(
            "orientationchange",
            function(){

                setTimeout(
                    updateOrientation,
                    100
                );

            }
        );

    }
    catch(error){

        console.error(
            "Responsive detection error:",
            error
        );

    }

})();

</script>

    इस सेवा का उपयोग करने के लिए नीचे दिए गए
    संदेश में <b>Hi</b> लिखकर Send करें।

`);


/* =========================================================
   SEND BUTTON
========================================================= */

sendBtn.addEventListener(
    "click",
    sendMessage
);


/* =========================================================
   ENTER KEY
========================================================= */

messageInput.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            e.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================================
   SEND MESSAGE
========================================================= */

function sendMessage(){

    const text =
        messageInput.value.trim();


    if(!text){

        return;

    }


    addMessage(
        text,
        "user"
    );


    messageInput.value =
        "";


    /* START */

    if(
        currentStep === "start"
    ){

        currentStep =
            "admit-card";


        setTimeout(
            function(){

                addMessage(`

                    कृपया अपना
                    <b>Admit Card</b>
                    फोटो भेजें।

                    <br><br>

                    नीचे 📎 बटन से फोटो select करें।

                `);

            },
            300
        );


        return;

    }


    /* MOBILE */

    if(
        currentStep === "mobile"
    ){

        handleMobileNumber(
            text
        );

        return;

    }


    addMessage(`

        कृपया ऊपर दिए गए निर्देश के अनुसार
        आवश्यक जानकारी भेजें।

    `);

}


/* =========================================================
   ATTACH BUTTON
========================================================= */

attachBtn.addEventListener(
    "click",
    function(){

        fileInput.click();

    }
);


/* =========================================================
   FILE SELECT
========================================================= */

fileInput.addEventListener(
    "change",
    function(){

        if(
            !fileInput.files.length
        ){

            return;

        }


        const file =
            fileInput.files[0];


        fileName.style.display =
            "block";


        fileName.textContent =
            "Selected: " + file.name;


        /* ADMIT CARD */

        if(
            currentStep === "admit-card"
        ){

            admitCardFile =
                file;


            addMessage(
                "📎 " + file.name,
                "user"
            );


            uploadAdmitCard();

        }


        /* PAYMENT */

        else if(
            currentStep === "payment"
        ){

            paymentScreenshotFile =
                file;


            addMessage(
                "📎 " + file.name,
                "user"
            );


            uploadPaymentScreenshot();

        }


        else{

            addMessage(`

                अभी इस समय file upload की जरूरत नहीं है।

            `);

        }

    }
);


/* =========================================================
   UNIQUE FILE NAME
========================================================= */

function createFileName(
    file
){

    const extension =
        file.name.includes(".")
        ? file.name.split(".").pop()
        : "jpg";


    return Date.now()
        + "_"
        + Math.random()
            .toString(36)
            .substring(2,10)
        + "."
        + extension;

}


/* =========================================================
   UPLOAD ADMIT CARD
========================================================= */

async function uploadAdmitCard(){

    if(!admitCardFile){

        return;

    }


    showTyping();


    try{

        const fileNameNew =
            createFileName(
                admitCardFile
            );


        const filePath =
            "admit-cards/" +
            fileNameNew;


        const {error} =
            await supabaseClient
            .storage
            .from("project-files")
            .upload(
                filePath,
                admitCardFile,
                {
                    cacheControl:"3600",
                    upsert:false
                }
            );


        if(error){

            throw error;

        }


        admitCardPath =
            filePath;


        removeTyping();


        fileName.style.display =
            "none";


        currentStep =
            "payment";


        addMessage(`

            <span class="success">
                ✅ Admit Card received successfully.
            </span>

            <br><br>

            अब ₹50 का payment करें।

            <br><br>

            नीचे दिए गए QR Code को scan करके
            <b>₹50</b> payment करें।

            <img
                src="${QR_CODE_URL}"
                class="qr"
                alt="Payment QR Code"
            >

            Payment करने के बाद
            उसका <b>Screenshot</b> भेजें।

        `);

    }
    catch(error){

        removeTyping();


        console.error(
            "Admit Card Upload Error:",
            error
        );


        fileName.style.display =
            "none";


        addMessage(`

            <span class="error">
                ❌ Admit Card upload नहीं हो पाया।
            </span>

            <br><br>

            कृपया दोबारा photo select करें।

        `);

    }

}

/* =========================================================
   MOBILE NUMBER
========================================================= */

async function handleMobileNumber(
    number
){

    const mobile =
        number.replace(
            /\D/g,
            ""
        );


    if(
        mobile.length !== 10
    ){

        addMessage(`

            <span class="error">
                ❌ कृपया 10 अंकों का सही Mobile Number भेजें।
            </span>

        `);

        return;

    }


    showTyping();


    try{

        const admitPath =
            admitCardPath || "";


        const paymentPath =
            paymentScreenshotPath || "";


        const {data,error} =
            await supabaseClient
            .from(
                "project_file_submissions"
            )
            .insert({

                mobile_number:
                    mobile,

                admit_card_url:
                    admitPath,

                payment_screenshot_url:
                    paymentPath,

                verification_status:
                    "pending",

                download_link:
                    DOWNLOAD_LINK

            })
            .select("id")
            .single();


        if(error){

            throw error;

        }


        submissionId =
            data.id;


        removeTyping();


        currentStep =
            "waiting";


        addMessage(`

            <span class="success">
                ✅ आपकी submission successfully भेज दी गई है।
            </span>

            <br><br>

            📱 Mobile Number:
            <b>${mobile}</b>

            <br><br>

            अब आपके documents की verification की जाएगी।

            <br><br>

            कृपया प्रतीक्षा करें...

        `);


        startVerificationCheck();

    }
    catch(error){

        removeTyping();


        console.error(
            "Database Error:",
            error
        );


        addMessage(`

            <span class="error">
                ❌ Submission भेजने में समस्या हुई।
            </span>

            <br><br>

            कृपया कुछ देर बाद दोबारा प्रयास करें।

        `);

    }

}


/* =========================================================
   START VERIFICATION CHECK
========================================================= */

function startVerificationCheck(){

    if(!submissionId){

        return;

    }


    if(verificationTimer){

        clearInterval(
            verificationTimer
        );

    }


    verificationTimer =
        setInterval(
            checkVerification,
            5000
        );


    checkVerification();

}


/* =========================================================
   CHECK VERIFICATION
========================================================= */

async function checkVerification(){

    if(!submissionId){

        return;

    }


    try{

        const {data,error} =
            await supabaseClient
            .from(
                "project_file_submissions"
            )
            .select(
                "verification_status,download_link"
            )
            .eq(
                "id",
                submissionId
            )
            .single();


        if(error){

            console.error(
                "Verification Check Error:",
                error
            );

            return;

        }


        /* =================================================
           DONE
        ================================================= */

        if(
            data.verification_status === "done"
        ){

            clearInterval(
                verificationTimer
            );


            currentStep =
                "completed";


            const message =
                addMessage(`

                    <span class="success">
                        ✅ Document Verification Done
                    </span>

                    <br><br>

                    आपका Project File तैयार है।

                    <br><br>

                    <button
                        type="button"
                        class="download-btn"
                        id="downloadProjectFileBtn"
                    >
                        📥 Download Project File
                    </button>

                `);


            const downloadUrl =
                data.download_link ||
                DOWNLOAD_LINK;


            const downloadButton =
                message.querySelector(
                    "#downloadProjectFileBtn"
                );


            if(downloadButton){

                downloadButton.addEventListener(
                    "click",
                    function(){

                        if(!downloadUrl){

                            alert(
                                "Download link उपलब्ध नहीं है।"
                            );

                            return;

                        }


                        window.open(
                            downloadUrl,
                            "_blank"
                        );

                    }
                );

            }

        }


        /* =================================================
           FAILED
        ================================================= */

        else if(
            data.verification_status === "failed"
        ){

            clearInterval(
                verificationTimer
            );


            currentStep =
                "failed";


            addMessage(`

                <span class="error">
                    ❌ Your document verification failed
                </span>

            `);

        }

    }
    catch(error){

        console.error(
            error
        );

    }

}
