<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MJ1 Online Quiz</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
}

header{

background:#0d47a1;
color:white;
padding:20px;
text-align:center;

}

.container{

width:90%;
max-width:800px;
margin:30px auto;

}

.quiz-box{

background:white;
padding:25px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,.15);

}

#question-number{

font-size:18px;
font-weight:bold;
color:#0d47a1;
margin-bottom:10px;

}

#question{

font-size:22px;
font-weight:bold;
margin-bottom:25px;

}

.option{

background:#f2f2f2;
padding:15px;
margin-bottom:12px;
border-radius:8px;
cursor:pointer;

}

.option:hover{

background:#dbe9ff;

}

.option input{

margin-right:10px;

}

.buttons{

display:flex;
justify-content:space-between;
margin-top:25px;

}

button{

background:#0d47a1;
color:white;
border:none;
padding:12px 30px;
font-size:16px;
border-radius:6px;
cursor:pointer;

}

button:hover{

background:#08306b;

}

#result{

display:none;
text-align:center;
padding:30px;

}

footer{

margin-top:40px;
background:#08306b;
color:white;
text-align:center;
padding:15px;

}

</style>

</head>

<body>

<header>

<h1>MJ1 Online Quiz</h1>

<p>Political Science (Semester 1)</p>

</header>

<div class="container">

<div class="quiz-box">

<div id="quiz">

<div id="question-number">
Question 1 of 25
</div>

<div id="question">
Loading...
</div>

<div id="options">

<label class="option">
<input type="radio" name="answer">
Option 1
</label>

<label class="option">
<input type="radio" name="answer">
Option 2
</label>

<label class="option">
<input type="radio" name="answer">
Option 3
</label>

<label class="option">
<input type="radio" name="answer">
Option 4
</label>

</div>

<div class="buttons">

<button id="nextBtn">
Next
</button>

<button id="submitBtn" style="display:none;">
Submit
</button>

</div>

</div>

<div id="result">

<h2>Quiz Result</h2>

<h3 id="score"></h3>

<h3 id="percentage"></h3>

<h3 id="status"></h3>

</div>

</div>

</div>

<footer>

Student Portal

</footer>

<script src="mj1-quiz.js"></script>

</body>
</html>
