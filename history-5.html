<style>

<script>

const supabaseClient = window.supabase.createClient(
    "https://aghizlgvrhunpuxvohep.supabase.co",
    "sb_publishable_gpc7KUqUIykO3WM1aCzRfg_Myo8AKyx"
);


document.querySelectorAll(".paper").forEach(paper => {

    const paperName =
        paper.querySelector(".paper-name").textContent.trim();


    paper.querySelectorAll(".buttons button").forEach(button => {

        button.addEventListener("click", async () => {

            const buttonText =
                button.textContent.trim();


            // ===============================
            // SOLUTION VIDEO
            // ===============================

            if (buttonText === "Solution Video") {

                const { data, error } =
                    await supabaseClient
                        .from("solution_videos")
                        .select("*")
                        .eq("semester", "Semester 5")
                        .eq("honours_subject", "History")
                        .eq("paper_name", paperName);


                if (error) {

                    alert(
                        "Video Error: " +
                        error.message
                    );

                    return;
                }


                if (!data || data.length === 0) {

                    alert(
                        "इस Paper के लिए Solution Video उपलब्ध नहीं है।"
                    );

                    return;
                }


                window.open(
                    data[0].video_url,
                    "_blank"
                );

                return;
            }


            // ===============================
            // PDF CONTENT
            // ===============================

            const contentType = buttonText;


            const { data, error } =
                await supabaseClient
                    .from("receipts")
                    .select("*")
                    .eq("semester", "Semester 5")
                    .eq("honours_subject", "History")
                    .eq("paper_name", paperName)
                    .eq("content_type", contentType);


            if (error) {

                alert(
                    "Error: " +
                    error.message
                );

                return;
            }


            if (!data || data.length === 0) {

                alert(
                    "इस Paper के लिए PDF उपलब्ध नहीं है।"
                );

                return;
            }


            data.forEach(file => {

                const url =
                    supabaseClient.storage
                        .from("receipts")
                        .getPublicUrl(
                            file.file_path
                        )
                        .data.publicUrl;


                window.open(
                    url,
                    "_blank"
                );

            });

        });

    });

});

</script>
