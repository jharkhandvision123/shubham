        ============================== */

        .logo {
            display: flex;

            width: 65px;
            height: 65px;

        }

            margin: 3px 0 0;

        /* ==============================
           SLIDER
        ============================== */

        .slider {
            width: 100%;
            max-width: 1100px;
            height: 350px;
            margin: 20px auto;
            overflow: hidden;
            border-radius: 12px;
        }

        .slides {
            display: flex;
            width: 400%;
            height: 100%;
            animation: slide 16s infinite;
        }

        .slides img {
            width: 25%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        @keyframes slide {

            0% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-25%);
            }

            45% {
                transform: translateX(-25%);
            }

            50% {
                transform: translateX(-50%);
            }

            70% {
                transform: translateX(-50%);
            }

            75% {
                transform: translateX(-75%);
            }

            95% {
                transform: translateX(-75%);
            }

            100% {
                transform: translateX(0);
            }

        }

            font-size:30px;
            font-weight:800;
            color:#0d47a1;

        .join-group-text p{

            font-size:16px;
            line-height:1.5;
            color:#333;
        }

        .join-group-link:hover{
            transform:translateY(-2px);
        }

        @media(max-width:600px){

            .join-group-link{
                gap:15px;
                padding:15px;
            }

<!-- =========================================
     FIREBASE PUSH NOTIFICATION
========================================= -->

<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
        getMessaging,
        getToken
    }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";


    const firebaseConfig = {

        apiKey:
            "AIzaSyD8YmnfyVnEXKIxBsKeAdQZYVo1CHjmYXg",

        authDomain:
            "spddc-notification.firebaseapp.com",

        projectId:
            "spddc-notification",

        storageBucket:
            "spddc-notification.firebasestorage.app",

        messagingSenderId:
            "329322876402",

        appId:
            "1:329322876402:web:736db8f195a23a18206f6b"

    };


    const app =
        initializeApp(firebaseConfig);


    const messaging =
        getMessaging(app);


    window.addEventListener("load", async function () {

        try {

            /* ==============================
               REQUEST NOTIFICATION PERMISSION
            ============================== */

            const permission =
                await Notification.requestPermission();


            if (permission !== "granted") {

                console.log(
                    "Notification permission was not granted."
                );

                return;

            }


            console.log(
                "Notification permission granted."
            );


            /* ==============================
               GET FIREBASE TOKEN
            ============================== */

            const registration =
                await navigator.serviceWorker.ready;


            const token =
                await getToken(

                    messaging,

                    {

                        vapidKey:
                            "BMpeXyHCM_IBCYIH6jVLMlyNZE3M4lTNkO9yahExvW9OkALmcFNpnHYDIW-1xVqoMP_XbNLs-sa6sLNdqZx8oBc",

                        serviceWorkerRegistration:
                            registration

                    }

                );


            if (!token) {

                console.log(
                    "No notification token received."
                );

                return;

            }


            console.log(
                "Notification Token:",
                token
            );


            /* ==============================
               SAVE TOKEN TO SUPABASE
            ============================== */

            const SUPABASE_URL =
                "https://aghizlgvrhunpuxvohep.supabase.co";


            const SUPABASE_KEY =
                "sb_publishable_gpc7KUqUIykO3WM1aCzRfg_Myo8AKyx";


            const response =
                await fetch(

                    SUPABASE_URL +
                    "/rest/v1/push_subscriptions",

                    {

                        method: "POST",

                        headers: {

                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " +
                                SUPABASE_KEY,

                            "Content-Type":
                                "application/json",

                            "Prefer":
                                "resolution=ignore-duplicates"

                        },

                        body:
                            JSON.stringify({

                                token: token

                            })

                    }

                );


            if (!response.ok) {

                const errorText =
                    await response.text();

                console.error(
                    "Supabase Token Save Error:",
                    errorText
                );

                return;

            }


            console.log(
                "Notification token saved successfully."
            );


        }

        catch (error) {

            console.error(
                "Firebase Notification Error:",
                error
            );

        }

    });

</script>
