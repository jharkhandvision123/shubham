```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Portal</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* ==============================
           LOGO
        ============================== */

        .portal-logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            display: block;
            margin: 0 auto 10px;
        }


        /* ==============================
           SLIDER
        ============================== */

        .slider {
            width: 100%;
            max-width: 1000px;
            margin: 20px auto;
            overflow: hidden;
            border-radius: 12px;
        }

        .slides {
            display: flex;
            width: 300%;
            animation: slide 12s infinite;
        }

        .slides img {
            width: 33.3333%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        @keyframes slide {

            0% {
                transform: translateX(0);
            }

            30% {
                transform: translateX(0);
            }

            35% {
                transform: translateX(-33.3333%);
            }

            65% {
                transform: translateX(-33.3333%);
            }

            70% {
                transform: translateX(-66.6666%);
            }

            95% {
                transform: translateX(-66.6666%);
            }

            100% {
                transform: translateX(0);
            }

        }

    </style>

</head>


<body>


<!-- ==============================
     HEADER
================================ -->

<header class="top-header">

    <div class="logo">

        <img
            src="images/imageslogo-192.png%20(1).jpeg"
            alt="Student Portal Logo"
            class="portal-logo"
        >

        <h1>Student Portal</h1>

        <p>Welcome to Student Portal</p>

    </div>

</header>

================================ -->

</nav>

     SLIDER
================================ -->

<section class="slider">

    <div class="slides">

        <img
            src="images/slide1.jpg"
            alt="Slide 1"
        >

        <img
            src="images/slide2.jpg"
            alt="Slide 2"
        >

        <img
            src="images/slide3.jpg"
            alt="Slide 3"
        >

    </div>

</section>
