        /* ==============================
           LOGO
        ============================== */

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .portal-logo {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .logo h1 {
            margin: 0;
        }

        .logo p {
            margin: 3px 0 0;
        }


        /* ==============================
           SLIDER
        ============================== */

        .slider {
            width: 100%;
            max-width: 1100px;
            height: 350px;
            margin: 20px auto;
            overflow: hidden;
            border-radius: 12px;
        }

       .slides {
    display: flex;
    width: 400%;
    height: 100%;
    animation: slide 16s infinite;
}

.slides img {
    width: 25%;
    height: 100%;
    display: block;
    object-fit: cover;
}

@keyframes slide {

    0% {
        transform: translateX(0);
    }

    20% {
        transform: translateX(0);
    }

    25% {
        transform: translateX(-25%);
    }

    45% {
        transform: translateX(-25%);
    }

    50% {
        transform: translateX(-50%);
    }

    70% {
        transform: translateX(-50%);
    }

    75% {
        transform: translateX(-75%);
    }

    95% {
        transform: translateX(-75%);
    }

    100% {
        transform: translateX(0);
    }

}
