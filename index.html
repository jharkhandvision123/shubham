
<!DOCTYPE html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JHARKHANDVISION123</title>

    <!-- ==============================
         PWA SETTINGS
    ============================== -->

    <link rel="manifest" href="./manifest.json">

    <meta name="theme-color" content="#ffffff">

    <link
        rel="apple-touch-icon"
        href="images/imageslogo-192.png%20(1).jpeg"
    >


    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* ==============================
           LOGO
        ============================== */

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .portal-logo {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .logo h1 {
            margin: 0;
        }

        .logo p {
            margin: 3px 0 0;
        }


        /* ==============================
           SLIDER
        ============================== */

        .slider {
            width: 100%;
            max-width: 1100px;
            height: 350px;
            margin: 20px auto;
            overflow: hidden;
            border-radius: 12px;
        }

        .slides {
            display: flex;
            width: 300%;
            height: 100%;
            animation: slide 12s infinite;
        }

        .slides img {
            width: 33.3333%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        @keyframes slide {

            0% {
                transform: translateX(0);
            }

            30% {
                transform: translateX(0);
            }

            35% {
                transform: translateX(-33.3333%);
            }

            65% {
                transform: translateX(-33.3333%);
            }

            70% {
                transform: translateX(-66.6666%);
            }

            95% {
                transform: translateX(-66.6666%);
            }

            100% {
                transform: translateX(0);
            }

        }

    </style>

</head>


<body>

<!-- ==============================
     PWA SERVICE WORKER
================================ -->

<script>

    if ("serviceWorker" in navigator) {

        window.addEventListener("load", function () {

            navigator.serviceWorker
                .register("./service-worker.js")

                .then(function () {

                    console.log(
                        "JV 123 Service Worker registered successfully."
                    );

                })

                .catch(function (error) {

                    console.error(
                        "Service Worker registration failed:",
                        error
                    );

                });

        });

    }

</script>
