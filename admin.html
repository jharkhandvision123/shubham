<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Receipt Management</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    background:#f4f7fc;
    color:#222;
}

header{
    background:#0d47a1;
    color:white;
    text-align:center;
    padding:25px 15px;
}

.container{
    width:92%;
    max-width:750px;
    margin:30px auto;
}

.box{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
    margin-bottom:20px;
}

h2{
    color:#0d47a1;
    text-align:center;
}

input,
select,
textarea{
    width:100%;
    padding:13px;
    border:2px solid #0d47a1;
    border-radius:8px;
    font-size:16px;
    margin-top:10px;
}

textarea{
    resize:vertical;
    min-height:110px;
}

button{
    width:100%;
    padding:13px;
    margin-top:12px;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

#loginBtn,
#searchBtn,
#uploadBtn,
#addVideoBtn,
#searchDeleteBtn,
#uploadReceiptBtn,
#projectFileRefreshBtn,
#formFillingRefreshBtn,
#sendNotificationBtn{
    background:#0d47a1;
    color:white;
}

.deleteBtn{
    background:#d32f2f;
    color:white;
}

.receipt{
    border:1px solid #ddd;
    border-radius:8px;
    padding:15px;
    margin-top:15px;
}

.logoutBtn{
    background:#555;
    color:white;
}

#message,
#uploadMessage,
#videoMessage,
#deleteMessage,
#receiptUploadMessage,
#projectFileMessage,
#formFillingMessage,
#notificationStatus{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

#adminPanel{
    display:none;
}

#loginMessage{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}


/* =========================================
   NOTIFICATION MANAGEMENT
========================================= */

.notification-box-title{
    text-align:center;
    color:#0d47a1;
}

.notification-history-title{
    color:#0d47a1;
    margin-top:20px;
    margin-bottom:10px;
}

.notification-item{
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
    margin-top:15px;
    background:#fafafa;
}

.notification-item-title{
    font-size:17px;
    font-weight:bold;
    color:#0d47a1;
}

.notification-item-message{
    margin-top:8px;
    line-height:1.5;
}

.notification-item-date{
    margin-top:8px;
    font-size:12px;
    color:#777;
}

.notification-item-link{
    display:block;
    margin-top:8px;
    word-break:break-all;
}


/* =========================================
   PROJECT FILE VERIFICATION
========================================= */

.project-submission{
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
    margin-top:15px;
    background:#fafafa;
}

.project-mobile{
    font-size:17px;
    font-weight:bold;
    color:#0d47a1;
    margin-bottom:10px;
}

.project-date{
    font-size:12px;
    color:#777;
    margin-bottom:10px;
}

.project-status{
    padding:8px;
    border-radius:6px;
    text-align:center;
    font-weight:bold;
    margin-top:10px;
}

.status-pending{
    background:#fff3cd;
    color:#856404;
}

.status-done{
    background:#d4edda;
    color:#155724;
}

.status-failed{
    background:#f8d7da;
    color:#721c24;
}

.view-document-btn{
    background:#455a64;
    color:white;
}

.verify-done-btn{
    background:#198754;
    color:white;
}

.verify-failed-btn{
    background:#d32f2f;
    color:white;
}

.project-buttons{
    margin-top:10px;
}

.project-buttons button{
    margin-top:8px;
}

.no-project-data{
    text-align:center;
    padding:20px;
    color:#666;
    background:#f5f5f5;
    border-radius:8px;
}


/* =========================================
   PROJECT FILE DELETE BUTTON
========================================= */

.project-delete-btn{
    background:#777;
    color:white;
    width:auto;
    padding:8px 12px;
    font-size:13px;
    margin-top:8px;
}


/* =========================================
   FORM FILLING MANAGEMENT
========================================= */

.form-filling-submission{
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
    margin-top:15px;
    background:#fafafa;
}

.form-filling-serial{
    font-size:18px;
    font-weight:bold;
    color:#0d47a1;
    margin-bottom:8px;
}

.form-filling-info{
    line-height:1.7;
}

.form-filling-status{
    padding:8px;
    border-radius:6px;
    text-align:center;
    font-weight:bold;
    margin-top:10px;
}

.form-filling-buttons{
    margin-top:10px;
}

.form-filling-buttons button{
    margin-top:8px;
}

.form-filling-delete-btn{
    background:#d32f2f;
    color:white;
}

.form-document-image{
    width:100%;
    max-width:100%;
    height:auto;
    max-height:500px;
    object-fit:contain;
    display:block;
    margin:10px auto;
    border:1px solid #ddd;
    border-radius:8px;
    background:white;
}

.form-document-box{
    display:none;
    margin-top:10px;
    padding:10px;
    background:white;
    border-radius:8px;
    border:1px solid #ddd;
}

.form-document-title{
    font-weight:bold;
    color:#0d47a1;
    margin-bottom:8px;
}

.form-pdf-link{
    display:block;
    width:100%;
    padding:12px;
    background:#455a64;
    color:white;
    text-align:center;
    text-decoration:none;
    border-radius:8px;
    margin-top:8px;
    font-weight:bold;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    .container{
        width:95%;
        margin:15px auto;
    }

    .box{
        padding:18px;
    }

    header{
        padding:20px 10px;
    }

    header h1{
        font-size:23px;
    }

    .form-document-image{
        max-height:400px;
    }

}

</style>

</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================
   SUPABASE CONFIG
========================================= */

const SUPABASE_URL =
    "https://aghizlgvrhunpuxvohep.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_gpc7KUqUIykO3WM1aCzRfg_Myo8AKyx";

const securityClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   LOGIN
========================================= */

const loginBox =
    document.getElementById("loginBox");

const adminPanel =
    document.getElementById("adminPanel");

const loginBtn =
    document.getElementById("loginBtn");

const logoutBtn =
    document.getElementById("logoutBtn");

const loginMessage =
    document.getElementById("loginMessage");


async function checkAdminSession(){

    try{

        const {
            data,
            error
        } =
        await securityClient.auth.getSession();

        if(error){

            console.error(error);
            showLogin();
            return;

        }

        if(data.session){

            showAdminPanel();

        }
        else{

            showLogin();

        }

    }
    catch(error){

        console.error(error);
        showLogin();

    }

}


function showAdminPanel(){

    loginBox.style.display = "none";

    adminPanel.style.display = "block";

    loadProjectFileSubmissions();

    loadFormFillingSubmissions();

}


function showLogin(){

    loginBox.style.display = "block";

    adminPanel.style.display = "none";

}


loginBtn.addEventListener(
    "click",
    async function(){

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        loginMessage.textContent = "";

        if(!email || !password){

            loginMessage.textContent =
                "Email और Password डालें।";

            return;

        }

        loginBtn.disabled = true;

        loginBtn.textContent = "LOGIN...";

        try{

            const {
                data,
                error
            } =
            await securityClient.auth.signInWithPassword({

                email:email,
                password:password

            });

            if(error){

                loginMessage.textContent =
                    "Invalid Email या Password.";

                loginBtn.disabled = false;

                loginBtn.textContent = "LOGIN";

                return;

            }

            if(data.session){

                document.getElementById("password").value = "";

                showAdminPanel();

            }

        }
        catch(error){

            console.error(error);

            loginMessage.textContent =
                "Login failed. फिर से प्रयास करें।";

        }

        loginBtn.disabled = false;

        loginBtn.textContent = "LOGIN";

    }
);


logoutBtn.addEventListener(
    "click",
    async function(){

        await securityClient.auth.signOut();

        showLogin();

        document.getElementById("email").value = "";

        document.getElementById("password").value = "";

    }
);


securityClient.auth.onAuthStateChange(
    function(event,session){

        if(session){

            showAdminPanel();

        }
        else{

            showLogin();

        }

    }
);


/* =========================================
   FORM FILLING
========================================= */

const formFillingRefreshBtn =
    document.getElementById(
        "formFillingRefreshBtn"
    );

const formFillingMessage =
    document.getElementById(
        "formFillingMessage"
    );

const formFillingResults =
    document.getElementById(
        "formFillingResults"
    );

let formFillingLoadNumber = 0;


formFillingRefreshBtn.addEventListener(
    "click",
    loadFormFillingSubmissions
);


async function loadFormFillingSubmissions(){

    const currentLoad =
        ++formFillingLoadNumber;

    formFillingMessage.textContent =
        "Loading...";

    formFillingMessage.style.color =
        "#222";

    formFillingResults.innerHTML = "";

    try{

        const {
            data,
            error
        } =
        await securityClient
        .from("form_filling_submissions")
        .select(
            "id,serial_number,form_type,semester,category,mobile_number,admit_card_url,payment_screenshot_url,status,created_at"
        )
        .order(
            "serial_number",
            {
                ascending:false
            }
        );

        if(currentLoad !== formFillingLoadNumber){
            return;
        }

        if(error){
            throw error;
        }

        formFillingMessage.textContent = "";

        if(!data || data.length === 0){

            formFillingResults.innerHTML = `
                <div class="no-project-data">
                    कोई Form Filling submission नहीं मिली।
                </div>
            `;

            return;

        }

        data.forEach(function(item){

            createFormFillingCard(item);

        });

    }
    catch(error){

        console.error(
            "Form Filling Load Error:",
            error
        );

        if(currentLoad !== formFillingLoadNumber){
            return;
        }

        formFillingMessage.textContent =
            "❌ Form Filling data load नहीं हो पाया।";

        formFillingMessage.style.color =
            "#d32f2f";

    }

}


/* =========================================
   CREATE FORM FILLING CARD
========================================= */

function createFormFillingCard(item){

    const card =
        document.createElement("div");

    card.className =
        "form-filling-submission";


    const serial =
        item.serial_number || "—";


    const status =
        String(
            item.status || "Pending"
        ).toLowerCase();


    let statusClass =
        "status-pending";

    let statusText =
        "⏳ PENDING";


    if(status === "done"){

        statusClass =
            "status-done";

        statusText =
            "✅ VERIFICATION DONE";

    }


    if(status === "failed"){

        statusClass =
            "status-failed";

        statusText =
            "❌ VERIFICATION FAILED";

    }


    let dateText = "";


    if(item.created_at){

        try{

            dateText =
                new Date(
                    item.created_at
                ).toLocaleString("en-IN");

        }
        catch(e){

            dateText = "";

        }

    }


    card.innerHTML = `

        <div class="form-filling-serial">
            Serial Number: ${escapeHtml(serial)}
        </div>

        <div class="form-filling-info">

            <b>Form Type:</b>
            ${escapeHtml(item.form_type || "Not available")}<br>

            <b>Category:</b>
            ${escapeHtml(item.category || "Not available")}<br>

            <b>Semester:</b>
            ${escapeHtml(item.semester || "Not available")}<br>

            <b>Mobile Number:</b>
            ${escapeHtml(item.mobile_number || "Not available")}

        </div>

        ${
            dateText
            ?
            `
            <div class="project-date">
                Submitted: ${escapeHtml(dateText)}
            </div>
            `
            :
            ""
        }

        <div class="form-filling-status ${statusClass}">
            ${statusText}
        </div>


        <div class="form-filling-buttons">

            ${
                item.admit_card_url
                ?
                `
                <button
                    type="button"
                    class="view-document-btn"
                    data-form-view="admit"
                >
                    🪪 VIEW ADMIT CARD
                </button>

                <div
                    class="form-document-box"
                    data-document-box="admit"
                >
                    <div class="form-document-title">
                        🪪 Admit Card
                    </div>
                </div>
                `
                :
                ""
            }


            ${
                item.payment_screenshot_url
                ?
                `
                <button
                    type="button"
                    class="view-document-btn"
                    data-form-view="payment"
                >
                    💳 VIEW PAYMENT SCREENSHOT
                </button>

                <div
                    class="form-document-box"
                    data-document-box="payment"
                >
                    <div class="form-document-title">
                        💳 Payment Screenshot
                    </div>
                </div>
                `
                :
                ""
            }


            ${
                status === "pending"
                ?
                `
                <button
                    type="button"
                    class="verify-done-btn"
                    data-form-action="done"
                >
                    ✅ VERIFICATION DONE
                </button>

                <button
                    type="button"
                    class="verify-failed-btn"
                    data-form-action="failed"
                >
                    ❌ VERIFICATION FAILED
                </button>
                `
                :
                `
                <button
                    type="button"
                    class="view-document-btn"
                    data-form-action="pending"
                >
                    🔄 CHANGE VERIFICATION
                </button>
                `
            }


            <button
                type="button"
                class="form-filling-delete-btn"
                data-form-delete="true"
            >
                🗑️ DELETE SUBMISSION
            </button>

        </div>

    `;


    formFillingResults.appendChild(card);


    const admitButton =
        card.querySelector(
            '[data-form-view="admit"]'
        );


    if(admitButton){

        admitButton.addEventListener(
            "click",
            function(){

                toggleFormDocument(
                    card,
                    "admit",
                    item.admit_card_url
                );

            }
        );

    }


    const paymentButton =
        card.querySelector(
            '[data-form-view="payment"]'
        );


    if(paymentButton){

        paymentButton.addEventListener(
            "click",
            function(){

                toggleFormDocument(
                    card,
                    "payment",
                    item.payment_screenshot_url
                );

            }
        );

    }


    card.querySelectorAll(
        "[data-form-action]"
    ).forEach(function(button){

        button.addEventListener(
            "click",
            function(){

                updateFormFillingStatus(
                    item.id,
                    button.getAttribute(
                        "data-form-action"
                    )
                );

            }
        );

    });


    const deleteButton =
        card.querySelector(
            '[data-form-delete="true"]'
        );


    if(deleteButton){

        deleteButton.addEventListener(
            "click",
            function(){

                deleteFormFillingSubmission(
                    item.id
                );

            }
        );

    }

}


/* =========================================
   VIEW FORM DOCUMENT
========================================= */

function toggleFormDocument(
    card,
    type,
    fileUrl
){

    if(!fileUrl){

        alert(
            "Document उपलब्ध नहीं है।"
        );

        return;

    }


    const box =
        card.querySelector(
            `[data-document-box="${type}"]`
        );


    if(!box){
        return;
    }


    if(
        box.style.display === "block"
    ){

        box.style.display = "none";

        box.innerHTML = `
            <div class="form-document-title">
                ${type === "admit" ? "🪪 Admit Card" : "💳 Payment Screenshot"}
            </div>
        `;

        return;

    }


    box.style.display = "block";


    const lowerUrl =
        fileUrl.toLowerCase();


    const isPdf =
        lowerUrl.includes(".pdf") ||
        lowerUrl.includes("application/pdf");


    if(isPdf){

        box.innerHTML = `
            <div class="form-document-title">
                ${type === "admit" ? "🪪 Admit Card PDF" : "💳 Payment Screenshot PDF"}
            </div>

            <a
                href="${escapeHtml(fileUrl)}"
                target="_blank"
                rel="noopener noreferrer"
                class="form-pdf-link"
            >
                📄 OPEN PDF
            </a>
        `;

        return;

    }


    box.innerHTML = `
        <div class="form-document-title">
            ${type === "admit" ? "🪪 Admit Card" : "💳 Payment Screenshot"}
        </div>

        <img
            src="${escapeHtml(fileUrl)}"
            class="form-document-image"
            alt="${type === "admit" ? "Admit Card" : "Payment Screenshot"}"
            onerror="this.style.display='none';this.nextElementSibling.style.display='block';"
        >

        <a
            href="${escapeHtml(fileUrl)}"
            target="_blank"
            rel="noopener noreferrer"
            class="form-pdf-link"
            style="display:none;"
        >
            📄 OPEN DOCUMENT
        </a>
    `;

}


/* =========================================
   UPDATE FORM STATUS
========================================= */

async function updateFormFillingStatus(
    submissionId,
    status
){

    let confirmText = "";


    if(status === "done"){

        confirmText =
            "क्या आप इस Form Filling submission को VERIFICATION DONE करना चाहते हैं?";

    }
    else if(status === "failed"){

        confirmText =
            "क्या आप इस Form Filling submission को VERIFICATION FAILED करना चाहते हैं?";

    }
    else{

        confirmText =
            "क्या आप इस submission को फिर से PENDING करना चाहते हैं?";

    }


    if(!confirm(confirmText)){

        return;

    }


    try{

        formFillingMessage.textContent =
            "Verification update हो रहा है...";

        formFillingMessage.style.color =
            "#222";


        const newStatus =
            status === "pending"
            ?
            "Pending"
            :
            status === "done"
            ?
            "Done"
            :
            "Failed";


        const {
            error
        } =
        await securityClient
        .from("form_filling_submissions")
        .update({

            status:newStatus

        })
        .eq(
            "id",
            submissionId
        );


        if(error){

            throw error;

        }


        formFillingMessage.textContent =
            "✅ Verification successfully update हो गया।";

        formFillingMessage.style.color =
            "#198754";


        await loadFormFillingSubmissions();

    }
    catch(error){

        console.error(
            "Form Filling Verification Error:",
            error
        );


        formFillingMessage.textContent =
            "❌ Verification update नहीं हो पाया।";

        formFillingMessage.style.color =
            "#d32f2f";

    }

}


/* =========================================
   DELETE FORM FILLING SUBMISSION
========================================= */

async function deleteFormFillingSubmission(
    submissionId
){

    const confirmed =
        confirm(
            "क्या आप इस Form Filling submission को permanently delete करना चाहते हैं?\n\nDatabase record delete होगा। Admit Card और Payment Screenshot की Storage files delete नहीं होंगी।"

    }


    try{

        formFillingMessage.textContent =
            "Deleting...";

        formFillingMessage.style.color =

        const {

        } =
        await securityClient
        .from("form_filling_submissions")
        .delete()
        .eq(
            "id",
            submissionId
        );


        if(error){

            throw error;

        }


        formFillingMessage.textContent =
            "✅ Form Filling submission successfully deleted.";

        formFillingMessage.style.color =
            "#198754";

    catch(error){

}


/* =========================================
   PROJECT FILE
========================================= */

const projectFileRefreshBtn =
    document.getElementById(
        "projectFileRefreshBtn"
    );

const projectFileMessage =
    document.getElementById(
        "projectFileMessage"
    );

const projectFileResults =
    document.getElementById(
        "projectFileResults"
    );


projectFileRefreshBtn.addEventListener(
    "click",
    loadProjectFileSubmissions
);


async function loadProjectFileSubmissions(){

    projectFileMessage.textContent =
        "Loading...";

    projectFileResults.innerHTML = "";


    try{

        const {
            data,
            error
        } =
        await securityClient
        .from("project_file_submissions")
        .select(
            "id,mobile_number,admit_card_url,payment_screenshot_url,verification_status,download_link,created_at"
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


        if(error){

            throw error;

        }


        projectFileMessage.textContent = "";


        if(!data || data.length === 0){

            projectFileResults.innerHTML = `
                <div class="no-project-data">
                    कोई Project File submission नहीं मिली।
                </div>
            `;

            return;

        }


        data.forEach(function(item){

            createProjectSubmissionCard(item);

        });

    }
    catch(error){

        console.error(
            "Project File Load Error:",
            error
        );


        projectFileMessage.textContent =
            "Project File data load नहीं हो पाया।";

        projectFileMessage.style.color =
            "#d32f2f";

    }

}


function createProjectSubmissionCard(item){

    const card =
        document.createElement("div");

    card.className =
        "project-submission";


    const mobile =
        item.mobile_number || "Not available";


    const status =
        item.verification_status || "pending";


    let statusClass =
        "status-pending";

    let statusText =
        "⏳ PENDING";


    if(status === "done"){

        statusClass =
            "status-done";

        statusText =
            "✅ VERIFICATION DONE";

    }


    if(status === "failed"){

        statusClass =
            "status-failed";

        statusText =
            "❌ VERIFICATION FAILED";

    }


    let dateText = "";


    if(item.created_at){

        try{

            dateText =
                new Date(
                    item.created_at
                ).toLocaleString("en-IN");

        }
        catch(e){

            dateText = "";

        }

    }


    card.innerHTML = `

        <div class="project-mobile">
            📱 Mobile Number: ${escapeHtml(mobile)}
        </div>

        ${
            dateText
            ?
            `<div class="project-date">
                Submitted: ${escapeHtml(dateText)}
            </div>`
            :
            ""
        }

        <div class="project-status ${statusClass}">
            ${statusText}
        </div>

        <div class="project-buttons">

            <button
                type="button"
                class="view-document-btn"
                data-id="${item.id}"
                data-type="admit"
            >
                🪪 VIEW ADMIT CARD
            </button>

            <button
                type="button"
                class="view-document-btn"
                data-id="${item.id}"
                data-type="payment"
            >
                💳 VIEW PAYMENT SCREENSHOT
            </button>

            ${
                status === "pending"
                ?
                `
                <button
                    type="button"
                    class="verify-done-btn"
                    data-id="${item.id}"
                    data-action="done"
                >
                    ✅ VERIFICATION DONE
                </button>

                <button
                    type="button"
                    class="verify-failed-btn"
                    data-id="${item.id}"
                    data-action="failed"
                >
                    ❌ VERIFICATION FAILED
                </button>
                `
                :
                `
                <button
                    type="button"
                    class="view-document-btn"
                    data-id="${item.id}"
                    data-action="reset"
                >
                    🔄 CHANGE VERIFICATION
                </button>
                `
            }

            ${
                status === "failed"
                ?
                `
                <button
                    type="button"
                    class="project-delete-btn"
                    data-id="${item.id}"
                >
                    🗑️ DELETE
                </button>
                `
                :
                ""
            }

        </div>

    `;


    projectFileResults.appendChild(card);


    const viewButtons =
        card.querySelectorAll(
            ".view-document-btn"
        );


    viewButtons.forEach(
        function(button){

            const type =
                button.getAttribute(
                    "data-type"
                );


            if(type){

                button.addEventListener(
                    "click",
                    function(){

                        viewProjectDocument(
                            item,
                            type
                        );

                    }
                );

            }

        }
    );


    const doneButton =
        card.querySelector(
            '[data-action="done"]'
        );


    if(doneButton){

        doneButton.addEventListener(
            "click",
            function(){

                verifyProjectFile(
                    item.id,
                    "done"
                );

            }
        );

    }


    const failedButton =
        card.querySelector(
            '[data-action="failed"]'
        );


    if(failedButton){

        failedButton.addEventListener(
            "click",
            function(){

                verifyProjectFile(
                    item.id,
                    "failed"
                );

            }
        );

    }


    const resetButton =
        card.querySelector(
            '[data-action="reset"]'
        );


    if(resetButton){

        resetButton.addEventListener(
            "click",
            function(){

                changeVerification(
                    item.id
                );

            }
        );

    }


    const deleteButton =
        card.querySelector(
            ".project-delete-btn"
        );


    if(deleteButton){

        deleteButton.addEventListener(
            "click",
            function(){

                deleteProjectFile(
                    item.id
                );

            }
        );

    }

}


/* =========================================
   VIEW PROJECT DOCUMENT
========================================= */

async function viewProjectDocument(
    item,
    type
){

    let filePath = "";


    if(type === "admit"){

        filePath =
            item.admit_card_url || "";

    }


    if(type === "payment"){

        filePath =
            item.payment_screenshot_url || "";

    }


    if(!filePath){

        alert(
            "इस document की file उपलब्ध नहीं है।"
        );

        return;

    }


    try{

        const {
            data,
            error
        } =
        await securityClient
        .storage
        .from("project-files")
        .createSignedUrl(
            filePath,
            300
        );


        if(error){

            throw error;

        }


        if(!data || !data.signedUrl){

            throw new Error(
                "Signed URL नहीं मिला।"
            );

        }


        window.open(
            data.signedUrl,
            "_blank"
        );

    }
    catch(error){

        console.error(
            "Document View Error:",
            error
        );


        alert(
            "Document open नहीं हो पाया। कृपया फिर से प्रयास करें।"
        );

    }

}

/* =========================================
   DELETE PROJECT FILE
========================================= */

async function deleteProjectFile(
    submissionId
){

    if(!confirm(
        "क्या आप इस Project File का पूरा data delete करना चाहते हैं?\n\nAdmit Card, Payment Screenshot और Database Record सभी delete हो जाएंगे।"
    )){

        return;

    }


    try{

        projectFileMessage.textContent =
            "Deleting...";

        projectFileMessage.style.color =
            "#d32f2f";


        const {
            data:submission,
            error:fetchError
        } =
        await securityClient
        .from("project_file_submissions")
        .select(
            "id,admit_card_url,payment_screenshot_url"
        )
        .eq(
            "id",
            submissionId
        )
        .single();


        if(fetchError){

            throw fetchError;

        }


        if(!submission){

            throw new Error(
                "Submission नहीं मिली।"
            );

        }


        if(
            submission.admit_card_url
        ){

            const {
                error:admitError
            } =
            await securityClient
            .storage
            .from("project-files")
            .remove([
                submission.admit_card_url
            ]);


            if(admitError){

                throw admitError;

            }

        }


        if(
            submission.payment_screenshot_url
        ){

            const {
                error:paymentError
            } =
            await securityClient
            .storage
            .from("project-files")
            .remove([
                submission.payment_screenshot_url
            ]);


            if(paymentError){

                throw paymentError;

            }

        }


        const {
            error:deleteError
        } =
        await securityClient
        .from("project_file_submissions")
        .delete()
        .eq(
            "id",
            submissionId
        );


        if(deleteError){

            throw deleteError;

        }


        projectFileMessage.textContent =
            "✅ Project File data successfully deleted.";

        projectFileMessage.style.color =
            "#198754";


        await loadProjectFileSubmissions();

    }
    catch(error){

        console.error(
            "Project File Delete Error:",
            error
        );


        projectFileMessage.textContent =
            "❌ Project File delete नहीं हो पाया.";

        projectFileMessage.style.color =
            "#d32f2f";

    }

}


/* =========================================
   HTML ESCAPE
========================================= */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}
