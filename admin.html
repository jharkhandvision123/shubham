<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://aghizlgvrhunpuxvohep.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_gpc7KUqUIykO3WM1aCzRfg_Myo8AKyx";

const securityClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const loginBox =
    document.getElementById("loginBox");

const adminPanel =
    document.getElementById("adminPanel");

const loginBtn =
    document.getElementById("loginBtn");

const logoutBtn =
    document.getElementById("logoutBtn");

const loginMessage =
    document.getElementById("loginMessage");


const projectFileRefreshBtn =
    document.getElementById(
        "projectFileRefreshBtn"
    );

const projectFileMessage =
    document.getElementById(
        "projectFileMessage"
    );

const projectFileResults =
    document.getElementById(
        "projectFileResults"
    );


const formFillingRefreshBtn =
    document.getElementById(
        "formFillingRefreshBtn"
    );

const formFillingMessage =
    document.getElementById(
        "formFillingMessage"
    );

const formFillingResults =
    document.getElementById(
        "formFillingResults"
    );


function showAdminPanel(){

    loginBox.style.display = "none";

    adminPanel.style.display = "block";

    loadProjectFileSubmissions();

    loadFormFillingSubmissions();

}


function showLogin(){

    loginBox.style.display = "block";

    adminPanel.style.display = "none";

}


async function checkAdminSession(){

    try{

        const {
            data,
            error
        } =
        await securityClient.auth.getSession();


        if(error){

            console.error(error);

            showLogin();

            return;

        }


        if(data.session){

            showAdminPanel();

        }
        else{

            showLogin();

        }

    }
    catch(error){

        console.error(error);

        showLogin();

    }

}


loginBtn.addEventListener(
    "click",
    async function(){

        const email =
            document
            .getElementById("email")
            .value
            .trim();

        const password =
            document
            .getElementById("password")
            .value;


        loginMessage.textContent = "";


        if(!email || !password){

            loginMessage.textContent =
                "Email और Password डालें।";

            return;

        }


        loginBtn.disabled = true;

        loginBtn.textContent = "LOGIN...";


        try{

            const {
                data,
                error
            } =
            await securityClient.auth
            .signInWithPassword({

                email:email,
                password:password

            });


            if(error){

                loginMessage.textContent =
                    "Invalid Email या Password.";

                loginBtn.disabled = false;

                loginBtn.textContent = "LOGIN";

                return;

            }


            if(data.session){

                document
                .getElementById("password")
                .value = "";

                loginMessage.textContent = "";

                showAdminPanel();

            }

        }
        catch(error){

            console.error(error);

            loginMessage.textContent =
                "Login failed. फिर से प्रयास करें।";

        }


        loginBtn.disabled = false;

        loginBtn.textContent = "LOGIN";

    }
);


logoutBtn.addEventListener(
    "click",
    async function(){

        await securityClient.auth.signOut();

        showLogin();

        document
        .getElementById("email")
        .value = "";

        document
        .getElementById("password")
        .value = "";

    }
);


securityClient.auth.onAuthStateChange(
    function(event,session){

        if(session){

            showAdminPanel();

        }
        else{

            showLogin();

        }

    }
);


/* =========================================
   FORM FILLING LOAD
========================================= */

formFillingRefreshBtn.addEventListener(
    "click",
    loadFormFillingSubmissions
);


async function loadFormFillingSubmissions(){

    formFillingMessage.textContent =
        "Loading...";

    formFillingMessage.style.color =
        "#222";

    formFillingResults.innerHTML = "";


    try{

        const {
            data,
            error
        } =
        await securityClient
        .from("form_filling_submissions")
        .select(
            "id,form_type,semester,category,mobile_number,admit_card_url,payment_screenshot_url,status,created_at"
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


        if(error){

            throw error;

        }


        formFillingMessage.textContent = "";


        if(!data || data.length === 0){

            formFillingResults.innerHTML = `
                <div class="no-form-data">
                    कोई Form Filling submission नहीं मिली।
                </div>
            `;

            return;

        }


        data.forEach(function(item){

            createFormFillingSubmissionCard(item);

        });

    }
    catch(error){

        console.error(
            "Form Filling Load Error:",
            error
        );

        formFillingMessage.textContent =
            "❌ Form Filling data load नहीं हो पाया।";

        formFillingMessage.style.color =
            "#d32f2f";

    }

}


function createFormFillingSubmissionCard(item){

    const card =
        document.createElement("div");

    card.className =
        "form-submission";


    const mobile =
        item.mobile_number ||
        "Not available";

    const formType =
        item.form_type ||
        "Not available";

    const semester =
        item.semester ||
        "Not available";

    const category =
        item.category ||
        "Not available";


    const rawStatus =
        String(
            item.status ||
            "Pending"
        ).toLowerCase();


    let statusClass =
        "form-status-pending";

    let statusText =
        "⏳ PENDING";


    if(rawStatus === "done"){

        statusClass =
            "form-status-done";

        statusText =
            "✅ VERIFICATION DONE";

    }


    if(rawStatus === "failed"){

        statusClass =
            "form-status-failed";

        statusText =
            "❌ VERIFICATION FAILED";

    }


    let dateText = "";


    if(item.created_at){

        try{

            dateText =
                new Date(
                    item.created_at
                ).toLocaleString("en-IN");

        }
        catch(e){

            dateText = "";

        }

    }


    card.innerHTML = `

        <div class="form-mobile">
            📱 Mobile Number:
            ${escapeHtml(mobile)}
        </div>

        <div class="form-detail">
            <strong>Form Type:</strong>
            ${escapeHtml(formType)}
        </div>

        <div class="form-detail">
            <strong>Semester:</strong>
            ${escapeHtml(semester)}
        </div>

        <div class="form-detail">
            <strong>Honours Category:</strong>
            ${escapeHtml(category)}
        </div>

        ${
            dateText
            ?
            `
            <div class="project-date">
                Submitted:
                ${escapeHtml(dateText)}
            </div>
            `
            :
            ""
        }

        <div class="form-status ${statusClass}">
            ${statusText}
        </div>

        <div class="form-buttons">

            <button
                type="button"
                class="form-view-btn"
                data-type="admit"
            >
                🪪 VIEW ADMIT CARD
            </button>

            <button
                type="button"
                class="form-view-btn"
                data-type="payment"
            >
                💳 VIEW PAYMENT SCREENSHOT
            </button>

            ${
                rawStatus === "pending"
                ?
                `
                <button
                    type="button"
                    class="form-done-btn"
                    data-action="done"
                >
                    ✅ VERIFICATION DONE
                </button>

                <button
                    type="button"
                    class="form-failed-btn"
                    data-action="failed"
                >
                    ❌ VERIFICATION FAILED
                </button>
                `
                :
                `
                <button
                    type="button"
                    class="form-change-btn"
                    data-action="reset"
                >
                    🔄 CHANGE VERIFICATION
                </button>
                `
            }

        </div>

    `;


    formFillingResults.appendChild(card);


    const viewButtons =
        card.querySelectorAll(
            ".form-view-btn"
        );


    viewButtons.forEach(
        function(button){

            button.addEventListener(
                "click",
                function(){

                    const type =
                        button.getAttribute(
                            "data-type"
                        );

                    viewFormFillingDocument(
                        item,
                        type
                    );

                }
            );

        }
    );


    const doneButton =
        card.querySelector(
            '[data-action="done"]'
        );


    if(doneButton){

        doneButton.addEventListener(
            "click",
            function(){

                verifyFormFilling(
                    item.id,
                    "Done"
                );

            }
        );

    }


    const failedButton =
        card.querySelector(
            '[data-action="failed"]'
        );


    if(failedButton){

        failedButton.addEventListener(
            "click",
            function(){

                verifyFormFilling(
                    item.id,
                    "Failed"
                );

            }
        );

    }


    const resetButton =
        card.querySelector(
            '[data-action="reset"]'
        );


    if(resetButton){

        resetButton.addEventListener(
            "click",
            function(){

                changeFormFillingVerification(
                    item.id
                );

            }
        );

    }

}


function viewFormFillingDocument(
    item,
    type
){

    let fileUrl = "";


    if(type === "admit"){

        fileUrl =
            item.admit_card_url ||
            "";

    }


    if(type === "payment"){

        fileUrl =
            item.payment_screenshot_url ||
            "";

    }


    if(!fileUrl){

        alert(
            "इस document की file उपलब्ध नहीं है।"
        );

        return;

    }


    try{

        window.open(
            fileUrl,
            "_blank"
        );

    }
    catch(error){

        console.error(
            "Form Filling Document View Error:",
            error
        );

        alert(
            "Document open नहीं हो पाया। कृपया फिर से प्रयास करें।"
        );

    }

}


async function verifyFormFilling(
    submissionId,
    status
){

    let confirmText = "";


    if(status === "Done"){

        confirmText =
            "क्या आप इस Form Filling को VERIFICATION DONE करना चाहते हैं?";

    }
    else{

        confirmText =
            "क्या आप इस Form Filling को VERIFICATION FAILED करना चाहते हैं?";

    }


    if(!confirm(confirmText)){

        return;

    }


    try{

        formFillingMessage.textContent =
            "Verification update हो रहा है...";


        const {
            error
        } =
        await securityClient
        .from("form_filling_submissions")
        .update({
            status:status
        })
        .eq(
            "id",
            submissionId
        );


        if(error){

            throw error;

        }


        formFillingMessage.textContent =
            "✅ Verification successfully update हो गया।";

        formFillingMessage.style.color =
            "#198754";


        await loadFormFillingSubmissions();

    }
    catch(error){

        console.error(
            "Form Filling Verification Update Error:",
            error
        );


        formFillingMessage.textContent =

/* =========================================
   VIEW FORM FILLING DOCUMENT
========================================= */

function viewFormFillingDocument(
    item,
    type
){

    let fileUrl = "";


    if(type === "admit"){

        fileUrl =
            item.admit_card_url ||
            "";

    }


    if(type === "payment"){

        fileUrl =
            item.payment_screenshot_url ||
            "";

    }


    if(!fileUrl){

        alert(
            "इस document की file उपलब्ध नहीं है।"
        );

        return;
    }


    try{

        window.open(
            fileUrl,
            "_blank"
        );

    }
    catch(error){

        console.error(
            "Form Filling Document View Error:",
            error
        );

        alert(
            "Document open नहीं हो पाया। कृपया फिर से प्रयास करें।"
        );

    }

}


/* =========================================
   FORM FILLING VERIFICATION
========================================= */

async function verifyFormFilling(
    submissionId,
    status
){

    let confirmText =
        "";


    if(status === "Done"){

        confirmText =
            "क्या आप इस Form Filling को VERIFICATION DONE करना चाहते हैं?";

    }
    else{

        confirmText =
            "क्या आप इस Form Filling को VERIFICATION FAILED करना चाहते हैं?";

    }


    if(!confirm(confirmText)){

        return;

    }


    try{

        formFillingMessage.textContent =
            "Verification update हो रहा है...";

        formFillingMessage.style.color =
            "#222";


        const {
            error
        } =
        await securityClient
        .from("form_filling_submissions")
        .update({
            status:status
        })
        .eq(
            "id",
            submissionId
        );


        if(error){

            throw error;

        }


        formFillingMessage.textContent =
            "✅ Verification successfully update हो गया।";

        formFillingMessage.style.color =
            "#198754";


        await loadFormFillingSubmissions();

    }
    catch(error){

        console.error(
            "Form Filling Verification Update Error:",
            error
        );


        formFillingMessage.textContent =
            "❌ Verification update नहीं हो पाया।";

        formFillingMessage.style.color =
            "#d32f2f";

    }

}

/* =========================================
   FORM FILLING LOAD
========================================= */

formFillingRefreshBtn.addEventListener(
    "click",
    loadFormFillingSubmissions
);


async function loadFormFillingSubmissions(){

    formFillingMessage.textContent =
        "Loading...";

    formFillingMessage.style.color =
        "#222";

    formFillingResults.innerHTML = "";


    try{

        const {
            data,
            error
        } =
        await securityClient
        .from("form_filling_submissions")
        .select(
            "id,form_type,semester,category,mobile_number,admit_card_url,payment_screenshot_url,status,created_at"
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


        if(error){

            throw error;

        }


        formFillingMessage.textContent = "";


        if(!data || data.length === 0){

            formFillingResults.innerHTML = `
                <div class="no-form-filling-data">
                    कोई Form Filling submission नहीं मिली।
                </div>
            `;

            return;

        }


        data.forEach(
            createFormFillingSubmissionCard
        );

    }
    catch(error){

        console.error(
            "Form Filling Load Error:",
            error
        );

        formFillingMessage.textContent =
            "❌ Form Filling data load नहीं हो पाया।";

        formFillingMessage.style.color =
            "#d32f2f";

    }

}


function createFormFillingSubmissionCard(item){

    const card =
        document.createElement("div");


    card.className =
        "form-filling-submission";


    const mobile =
        item.mobile_number ||
        "Not available";


    const formType =
        item.form_type ||
        "Not available";


    const semester =
        item.semester ||
        "Not available";


    const category =
        item.category ||
        "Not available";


    const rawStatus =
        String(
            item.status ||
            "Pending"
        ).toLowerCase();


    let statusClass =
        "status-pending";


    let statusText =
        "⏳ PENDING";


    if(rawStatus === "done"){

        statusClass =
            "status-done";

        statusText =
            "✅ VERIFICATION DONE";

    }


    if(rawStatus === "failed"){

        statusClass =
            "status-failed";

        statusText =
            "❌ VERIFICATION FAILED";

    }


    let dateText = "";


    if(item.created_at){

        try{

            dateText =
                new Date(
                    item.created_at
                ).toLocaleString(
                    "en-IN"
                );

        }
        catch(e){

        }

    }


    card.innerHTML = `

        <div class="form-filling-title">
            📱 Mobile Number:
            ${escapeHtml(mobile)}
        </div>


        <div class="form-filling-info">

            <b>Form Type:</b>
            ${escapeHtml(formType)}
            <br>

            <b>Semester:</b>
            ${escapeHtml(semester)}
            <br>

            <b>Honours Category:</b>
            ${escapeHtml(category)}

        </div>


        ${
            dateText
            ?
            `
            <div class="project-date">
                Submitted:
                ${escapeHtml(dateText)}
            </div>
            `
            :
            ""
        }


        <div class="form-status ${statusClass}">
            ${statusText}
        </div>


        <div class="form-filling-buttons">

            <button
                type="button"
                class="form-view-btn"
                data-type="admit"
            >
                🪪 VIEW ADMIT CARD
            </button>


            <button
                type="button"
                class="form-view-btn"
                data-type="payment"
            >
                💳 VIEW PAYMENT SCREENSHOT
            </button>


            ${
                rawStatus === "pending"
                ?
                `
                <button
                    type="button"
                    class="form-done-btn"
                    data-action="done"
                >
                    ✅ VERIFICATION DONE
                </button>


                <button
                    type="button"
                    class="form-failed-btn"
                    data-action="failed"
                >
                    ❌ VERIFICATION FAILED
                </button>
                `
                :
                `
                <button
                    type="button"
                    class="form-change-btn"
                    data-action="reset"
                >
                    🔄 CHANGE VERIFICATION
                </button>
                `
            }

        </div>

    `;


    formFillingResults.appendChild(card);


    const viewButtons =
        card.querySelectorAll(
            ".form-view-btn"
        );


    viewButtons.forEach(
        function(button){

            button.addEventListener(
                "click",
                function(){

                    const type =
                        button.getAttribute(
                            "data-type"
                        );

                    viewFormFillingDocument(
                        item,
                        type
                    );

                }
            );

        }
    );


    const doneButton =
        card.querySelector(
            '[data-action="done"]'
        );


    if(doneButton){

        doneButton.addEventListener(
            "click",
            function(){

                verifyFormFilling(
                    item.id,
                    "Done"
                );

            }
        );

    }


    const failedButton =
        card.querySelector(
            '[data-action="failed"]'
        );


    if(failedButton){

        failedButton.addEventListener(
            "click",
            function(){

                verifyFormFilling(
                    item.id,
                    "Failed"
                );

            }
        );

    }


    const resetButton =
        card.querySelector(
            '[data-action="reset"]'
        );


    if(resetButton){

        resetButton.addEventListener(
            "click",
            function(){

                changeFormFillingVerification(
                    item.id
                );

            }
        );

    }
