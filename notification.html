<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notifications | S.P.D.D.C</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(
                to bottom,
                #ff9933 0%,
                #ffffff 48%,
                #ffffff 52%,
                #138808 100%
            );
            min-height: 100vh;
            color: #222;
        }

        .header {
            background: rgba(255, 255, 255, 0.96);
            padding: 22px 15px;
            text-align: center;
            border-bottom: 4px solid #138808;
            box-shadow: 0 3px 12px rgba(0,0,0,0.15);
        }

        .header h1 {
            color: #ff6600;
            font-size: 28px;
            margin-bottom: 6px;
        }

        .header p {
            color: #555;
            font-size: 14px;
        }

        .container {
            width: 94%;
            max-width: 800px;
            margin: 25px auto;
        }

        .notification-card {
            background: rgba(255,255,255,0.97);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.18);
            border-left: 6px solid #ff9933;
            position: relative;
        }

        .notification-card::after {
            content: "";
            position: absolute;
            left: -6px;
            bottom: 0;
            width: 6px;
            height: 50%;
            background: #138808;
            border-radius: 0 0 0 16px;
        }

        .notification-title {
            font-size: 20px;
            font-weight: bold;
            color: #d35400;
            margin-bottom: 10px;
        }

        .notification-message {
            font-size: 16px;
            line-height: 1.6;
            color: #333;
            white-space: pre-wrap;
            margin-bottom: 12px;
            overflow-wrap: anywhere;
word-break: break-word;
        }

        .notification-date {
            font-size: 12px;
            color: #777;
            margin-bottom: 14px;
        }

        .link-button {
            display: inline-block;
            text-decoration: none;
            background: #138808;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        .link-button:hover {
            opacity: 0.9;
        }

        .empty {
            background: rgba(255,255,255,0.96);
            padding: 30px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.15);
            color: #666;
        }

        .loading {
            text-align: center;
            padding: 30px;
            font-weight: bold;
            color: #444;
        }

        @media (max-width: 600px) {

            .header h1 {
                font-size: 24px;
            }

            .notification-card {
                padding: 16px;
            }

            .notification-title {
                font-size: 18px;
            }

            .notification-message {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🔔 Notifications</h1>
        <p>Latest updates and important information</p>
    </div>

    <div class="container">

        <div id="notificationList" class="loading">
            Notifications loading...
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL =
            "https://aghizlgvrhunpuxvohep.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_gpc7KUqUIykO3WM1aCzRfg_Myo8AKyx";

        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );

        async function loadNotifications() {

            const list =
                document.getElementById("notificationList");

            try {

                const { data, error } =
                    await supabaseClient
                        .from("notifications")
                        .select(
                            "id,title,message,link,created_at"
                        )
                        .order(
                            "created_at",
                            { ascending: false }
                        );

                if (error) {
                    throw error;
                }

                if (!data || data.length === 0) {

                    list.innerHTML = `
                        <div class="empty">
                            📭 अभी कोई Notification उपलब्ध नहीं है।
                        </div>
                    `;

                    return;
                }

                list.innerHTML = "";

                data.forEach(notification => {

                    const card =
                        document.createElement("div");

                    card.className =
                        "notification-card";

                    const date =
                        new Date(
                            notification.created_at
                        ).toLocaleString(
                            "en-IN",
                            {
                                dateStyle: "medium",
                                timeStyle: "short"
                            }
                        );

                    let linkHTML = "";

                    if (notification.link) {

                        let safeLink =
                            notification.link.trim();

                        if (
                            safeLink.startsWith("http://") ||
                            safeLink.startsWith("https://")
                        ) {

                            linkHTML = `
                                <a
                                    class="link-button"
                                    href="${safeLink}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                >
                                    🔗 Open Link
                                </a>
                            `;
                        }
                    }

                    card.innerHTML = `
                        <div class="notification-title">
                            ${escapeHTML(notification.title)}
                        </div>

                        <div class="notification-message">
                            ${escapeHTML(notification.message)}
                        </div>

                        <div class="notification-date">
                            🕒 ${date}
                        </div>

                        ${linkHTML}
                    `;

                    list.appendChild(card);
                });

            } catch (error) {

                console.error(
                    "Notification Load Error:",
                    error
                );

                list.innerHTML = `
                    <div class="empty">
                        ❌ Notifications load नहीं हो सकीं।
                    </div>
                `;
            }
        }

        function escapeHTML(text) {

            const div =
                document.createElement("div");

            div.textContent =
                text || "";

            return div.innerHTML;
        }

        loadNotifications();
    </script>

</body>
</html>
