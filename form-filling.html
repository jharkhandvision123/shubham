<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Form Filling</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial, sans-serif;
}

body{
  background:#f2f2f2;
  min-height:100vh;
}

.chat-container{
  width:100%;
  max-width:600px;
  margin:auto;
  min-height:100vh;
  background:white;
  display:flex;
  flex-direction:column;
}

.header{
  background:#075e54;
  color:white;
  padding:12px;
  display:flex;
  align-items:center;
  gap:10px;
  position:sticky;
  top:0;
  z-index:10;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#fff;
  color:#075e54;
  display:flex;
  align-items:center;
  justify-content:center;

}

.header-info h2{

}

.header-info p{
  font-size:12px;

}

.messages{
  flex:1;
  padding:15px;
  background:#efeae2;
  overflow-y:auto;
  min-height:calc(100vh - 130px);
}

.message{

  padding:10px 13px;
  margin-bottom:10px;
  border-radius:10px;
  font-size:14px;
  line-height:1.5;
  word-wrap:break-word;
}

.bot{
  background:white;

  margin-right:auto;
}

.user{
  background:#d9fdd3;
  border-top-right-radius:3px;

}

.options{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-bottom:15px;
}

.option-btn{
  width:100%;
  border:none;
  padding:12px;
  background:#075e54;
  color:white;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
}

.option-btn:hover{
  background:#064e47;
}

.option-btn.secondary{
  background:#128c7e;
}

.option-btn.danger{
  background:#d32f2f;
}

.input-area{
  display:none;
  padding:10px;
  background:#f0f0f0;
  border-top:1px solid #ddd;
  gap:8px;
}

.input-area input{
  flex:1;
  padding:11px;
  border:1px solid #ccc;
  border-radius:20px;
  outline:none;
}

.send-btn{
  border:none;
  background:#075e54;
  color:white;
  width:45px;
  height:45px;
  border-radius:50%;

}

.upload-box{

  border-radius:10px;

}

.upload-box input{

  margin-top:10px;
}

.upload-btn{
  margin-top:10px;
  width:100%;
  padding:11px;
  border:none;
  background:#075e54;
  color:white;
  border-radius:7px;
  cursor:pointer;
}

.status-box{
  background:white;
  padding:15px;
  border-radius:10px;
  margin-top:10px;
  text-align:center;
}

.qr-box{
  background:white;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
  text-align:center;
}

.qr-box img{
  width:220px;
  max-width:100%;
  margin-top:10px;
  border-radius:5px;
}

.receipt-btn{
  display:block;
  width:100%;
  padding:12px;
  background:#075e54;
  color:white;
  text-decoration:none;
  border-radius:8px;
  text-align:center;
  margin-bottom:8px;
}

.new-form-btn{
  width:100%;
  padding:12px;
  border:none;
  background:#128c7e;
  color:white;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
}

.small-note{
  font-size:12px;
  color:#666;
  margin-top:8px;
}

@media(max-width:600px){
  .chat-container{
    min-height:100vh;
  }

  .messages{
    padding:10px;
  }

  .message{
    max-width:90%;
  }
}
</style>
</head>

<body>

<div class="chat-container">

  <div class="header">
    <div class="avatar">JV</div>

    <div class="header-info">
      <h2>Form Filling</h2>
      <p>Online</p>
    </div>
  </div>

  <div id="messages" class="messages"></div>

  <div id="options" class="options"></div>

  <div id="inputArea" class="input-area">
    <input
      type="text"
      id="textInput"
      placeholder="अपना मोबाइल नंबर लिखें"
      maxlength="10"
    >

    <button class="send-btn" onclick="sendMobile()">
      ➤
    </button>
  </div>

</div>


<script>

/* =========================
   SUPABASE SETTINGS
========================= */

const SUPABASE_URL =
"https://aghizlgvrhunpuxvohep.supabase.co";

const SUPABASE_KEY =
"sb_publishable_gpc7KUqUIykO3WM1aCzRfg_Myo8AKyx";


/* =========================
   RECEIPT LINK
========================= */

const RECEIPT_LINK =
"https://jharkhandvision123.github.io/shubham/student-csc.html";


/* =========================
   STORAGE KEYS
========================= */

const STORAGE_KEY =
"formFillingChatData";

const SUBMISSION_ID_KEY =
"formFillingSubmissionId";

const STATUS_SHOWN_KEY =
"formFillingStatusShown";


/* =========================
   VARIABLES
========================= */

const messages =
document.getElementById("messages");

const options =
document.getElementById("options");

const inputArea =
document.getElementById("inputArea");

const textInput =
document.getElementById("textInput");


let step = 1;

let currentSubmissionId = null;

let statusCheckTimer = null;


let data = {
  form_type:"",
  category:"",
  semester:"",
  mobile_number:"",
  admit_card_url:"",
  payment_screenshot_url:"",
  status:"Pending"
};


/* =========================
   SAVE CHAT
========================= */

function saveChat(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify({
      step:step,
      currentSubmissionId:currentSubmissionId,
      data:data,
      messages:messages.innerHTML
    })
  );

}


/* =========================
   USER MESSAGE
========================= */

function user(text){

  const div =
  document.createElement("div");

  div.className =
  "message user";

  div.innerHTML =
  escapeHtml(text);

  messages.appendChild(div);

  scrollBottom();

  saveChat();

}


/* =========================
   BOT MESSAGE
========================= */

function bot(text){

  const div =
  document.createElement("div");

  div.className =
  "message bot";

  div.innerHTML =
  text;

  messages.appendChild(div);

  scrollBottom();

  saveChat();

}


/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(text){

  const div =
  document.createElement("div");

  div.textContent =
  text;

  return div.innerHTML;

}


/* =========================
   SCROLL
========================= */

function scrollBottom(){

  messages.scrollTop =
  messages.scrollHeight;

}


/* =========================
   CLEAR OPTIONS
========================= */

function clearOptions(){

  options.innerHTML = "";

}


/* =========================
   BUTTONS
========================= */

function buttons(items){

  clearOptions();

  inputArea.style.display =
  "none";

  items.forEach(item => {

    const btn =
    document.createElement("button");

    btn.className =
    "option-btn";

    if(item.className){
      btn.className +=
      " " + item.className;
    }

    btn.textContent =
    item.text;

    btn.onclick =
    item.action;

    options.appendChild(btn);

  });

  saveChat();

}


/* =========================
   START
========================= */

function start(){

  step = 1;

  data = {
    form_type:"",
    category:"",
    semester:"",
    mobile_number:"",
    admit_card_url:"",
    payment_screenshot_url:"",
    status:"Pending"
  };

  currentSubmissionId = null;

  localStorage.removeItem(
    SUBMISSION_ID_KEY
  );

  localStorage.removeItem(
    STATUS_SHOWN_KEY
  );

  bot(
    "कृपया अपना Form Type चुनें:"
  );

  buttons([

    {
      text:"1️⃣ Backlog Form",
      action:() =>
      chooseType("Backlog Form")
    },

    {
      text:"2️⃣ Regular Form",
      action:() =>
      chooseType("Regular Form")
    }

  ]);

}


/* =========================
   CHOOSE FORM TYPE
========================= */

function chooseType(type){

  user(type);

  data.form_type =
  type;

  step = 2;

  bot(
    "कृपया Honours का प्रकार चुनें:"
  );

  buttons([

    {
      text:"1️⃣ Practical Honours",
      action:() =>
      chooseCategory("Practical Honours")
    },

    {
      text:"2️⃣ Non-Practical Honours",
      action:() =>
      chooseCategory("Non-Practical Honours")
    }

  ]);

}


/* =========================
   CHOOSE CATEGORY
========================= */

function chooseCategory(category){

  user(category);

  data.category =
  category;

  step = 2;

  bot(
    "कृपया अपना Semester चुनें:"
  );

  const semesterButtons = [];

  for(let i=1;i<=8;i++){

    semesterButtons.push({

      text:"Semester " + i,

      action:() =>
      chooseSemester(
        "Semester " + i
      )

    });

  }

  buttons(
    semesterButtons
  );

}


/* =========================
   CHOOSE SEMESTER
========================= */

function chooseSemester(semester){

  user(semester);

  data.semester =
  semester;

  step = 4;

  bot(
    "कृपया अपना Admit Card Upload करें:"
  );

  showAdmitUpload();

}


/* =========================
   ADMIT UPLOAD UI
========================= */

function showAdmitUpload(){

  clearOptions();

  inputArea.style.display =
  "none";

  const box =
  document.createElement("div");

  box.className =
  "upload-box";

  box.innerHTML = `

    <strong>📄 Admit Card</strong>

    <p class="small-note">
      JPG, PNG या PDF Upload करें
    </p>

    <input
      type="file"
      id="admitFile"
      accept="image/*,.pdf"
    >

    <button
      class="upload-btn"
      onclick="uploadAdmitCard()"
    >
      Upload Admit Card
    </button>

  `;

  options.appendChild(box);

  saveChat();

}


/* =========================
   UPLOAD ADMIT CARD
========================= */

async function uploadAdmitCard(){

  const fileInput =
  document.getElementById("admitFile");

  if(!fileInput.files.length){

    alert(
      "कृपया Admit Card चुनें।"
    );

    return;

  }

  const file =
  fileInput.files[0];

  user(
    "📄 Admit Card Upload"
  );

  const url =
  await uploadFile(
    file,
    "admit-card"
  );

  if(!url){

    bot(
      "❌ Admit Card Upload नहीं हो पाया। कृपया दोबारा प्रयास करें।"
    );

    showAdmitUpload();

    return;

  }

  data.admit_card_url =
  url;

  step = 3;

  bot(
    "✅ Admit Card सफलतापूर्वक प्राप्त हो गया।"
  );

  bot(
    "अब NPU में Registered 10 Digit Mobile Number दर्ज करें:"
  );

  showMobileInput();

}


/* =========================
   MOBILE INPUT
========================= */

function showMobileInput(){

  clearOptions();

  inputArea.style.display =
  "flex";

  textInput.value =
  "";

  textInput.focus();

  saveChat();

}


/* =========================
   SEND MOBILE
========================= */

function sendMobile(){

  const mobile =
  textInput.value.trim();

  if(!/^[0-9]{10}$/.test(mobile)){

    alert(
      "कृपया सही 10 Digit Mobile Number दर्ज करें।"
    );

    return;

  }

  user(mobile);

  data.mobile_number =
  mobile;

  inputArea.style.display =
  "none";

  step = 5;

  bot(
    "अब Payment करें और Payment Screenshot Upload करें।"
  );

  payment();

}


/* =========================
   PAYMENT
========================= */

function payment(){

  clearOptions();

  let amount =
  "625";

  if(
    data.category ===
    "Practical Honours"
  ){

    amount =
    "775";

  }

  const box =
  document.createElement("div");

  box.className =
  "qr-box";

  box.innerHTML = `

    <strong>
      💳 Payment Amount: ₹${amount}
    </strong>

    <br><br>

    <img
      src="https://aghizlgvrhunpuxvohep.supabase.co/storage/v1/object/public/project-qr/qr.png"
      alt="Payment QR"
    >

    <br><br>

    <strong>
      Payment करने के बाद Screenshot Upload करें
    </strong>

    <br><br>

    <input
      type="file"
      id="paymentFile"
      accept="image/*"
    >

    <button
      class="upload-btn"
      onclick="uploadPaymentScreenshot()"
    >
      Upload Payment Screenshot
    </button>

  `;

  options.appendChild(box);

  saveChat();

}


/* =========================
   UPLOAD PAYMENT SCREENSHOT
========================= */

async function uploadPaymentScreenshot(){

  const fileInput =
  document.getElementById("paymentFile");

  if(!fileInput.files.length){

    alert(
      "कृपया Payment Screenshot चुनें।"
    );

    return;

  }

  const file =
  fileInput.files[0];

  user(
    "💳 Payment Screenshot Upload"
  );

  const url =
  await uploadFile(
    file,
    "payment-screenshot"
  );

  if(!url){

    bot(
      "❌ Payment Screenshot Upload नहीं हो पाया। कृपया दोबारा प्रयास करें।"
    );

    payment();

    return;

  }

  data.payment_screenshot_url =
  url;

  await submitForm();

}


/* =========================
   SUPABASE STORAGE UPLOAD
========================= */

async function uploadFile(file, folder){

  try{

    const fileName =
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2,10) +
    "_" +
    file.name
      .replace(/\s+/g,"_");

    const path =
    folder + "/" + fileName;

    const response =
    await fetch(

      SUPABASE_URL +
      "/storage/v1/object/form-filling-files/" +
      path,

      {

        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "x-upsert":"false"
        },

        body:file

      }

    );

    if(!response.ok){

      const errorText =
      await response.text();

      console.error(
        "Upload error:",
        errorText
      );

      return null;

    }

    const publicUrl =
      SUPABASE_URL +
      "/storage/v1/object/public/form-filling-files/" +
      path;

    return publicUrl;

  }catch(error){

    console.error(
      error
    );

    return null;

  }

}


/* =========================
   SUBMIT FORM
========================= */

async function submitForm(){

  bot(
    "⏳ आपकी जानकारी Submit की जा रही है..."
  );

  try{

    const response =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/rpc/create_form_filling_submission",

      {

        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({

          p_form_type:
          data.form_type,

          p_semester:
          data.semester,

          p_category:
          data.category,

          p_mobile_number:
          data.mobile_number,

          p_admit_card_url:
          data.admit_card_url,

          p_payment_screenshot_url:
          data.payment_screenshot_url

        })

      }

    );


    if(!response.ok){

      const errorText =
      await response.text();

      console.error(
        "Submit error:",
        errorText
      );

      bot(
        "❌ Submission में समस्या आई है। कृपया दोबारा प्रयास करें।"
      );

      return;

    }


    const result =
    await response.json();


    currentSubmissionId =
    Number(result);

    localStorage.setItem(
      SUBMISSION_ID_KEY,
      currentSubmissionId
    );

    localStorage.removeItem(
      STATUS_SHOWN_KEY
    );


    step = 6;

    bot(
      "आपकी सारी जानकारी सफलतापूर्वक प्राप्त कर ली गई है। Verification एवं Form Filling तक कृपया प्रतीक्षा करें।"
    );

    startStatusChecking();

    saveChat();

  }catch(error){

    console.error(
      error
    );

    bot(
      "❌ Submission में समस्या आई है। कृपया दोबारा प्रयास करें।"
    );

  }

}


/* =========================
   STATUS CHECKING
========================= */

function startStatusChecking(){

  if(statusCheckTimer){

    clearInterval(
      statusCheckTimer
    );

  }

  checkSubmissionStatus();

  statusCheckTimer =
  setInterval(
    checkSubmissionStatus,
    5000
  );

}


/* =========================
   CHECK STATUS
========================= */

async function checkSubmissionStatus(){

  if(!currentSubmissionId){

    return;

  }

  try{

    const response =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/rpc/get_form_filling_status",

      {

        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({

          submission_id:
          currentSubmissionId

        })

      }

    );


    if(!response.ok){

      console.error(
        "Status error:",
        await response.text()
      );

      return;

    }


    const result =
    await response.json();


    if(
      !result ||
      !result.length
    ){

      return;

    }


    const status =
    result[0].status;


    data.status =
    status;


    /* =========================
       DONE
    ========================= */

    if(
      status === "Done"
    ){

      if(
        localStorage.getItem(
          STATUS_SHOWN_KEY
        ) !== "Done"
      ){

        localStorage.setItem(
          STATUS_SHOWN_KEY,
          "Done"
        );

        bot(
          "✅ Verification Done हो गया है।"
        );

      }

      if(statusCheckTimer){

        clearInterval(
          statusCheckTimer
        );

        statusCheckTimer =
        null;

      }

      showCompletionOptions();

      saveChat();

    }


    /* =========================
       FAILED
    ========================= */

    else if(
      status === "Failed"
    ){

      if(
        localStorage.getItem(
          STATUS_SHOWN_KEY
        ) !== "Failed"
      ){

        localStorage.setItem(
          STATUS_SHOWN_KEY,
          "Failed"
        );

        bot(
          "❌ आपका Verification Failed हो गया है। कृपया पुनः Form Filling करें।"
        );

      }

      if(statusCheckTimer){

        clearInterval(
          statusCheckTimer
        );

        statusCheckTimer =
        null;

      }

      showNewFormButton();

      saveChat();

    }


  }catch(error){

    console.error(
      error
    );

  }

}


/* =========================
   COMPLETION OPTIONS
========================= */

function showCompletionOptions(){

  clearOptions();

  inputArea.style.display =
  "none";


  if(RECEIPT_LINK){

    const receipt =
    document.createElement("a");

    receipt.href =
    RECEIPT_LINK;

    receipt.target =
    "_blank";

    receipt.className =
    "receipt-btn";

    receipt.textContent =
    "📥 Download Receipt";

    options.appendChild(
      receipt
    );

  }


  const newBtn =
  document.createElement("button");

  newBtn.className =
  "new-form-btn";

  newBtn.textContent =
  "📝 New Form Filling";

  newBtn.onclick =
  startNewForm;

  options.appendChild(
    newBtn
  );

  saveChat();

}


/* =========================
   NEW FORM BUTTON
========================= */

function showNewFormButton(){

  clearOptions();

  inputArea.style.display =
  "none";


  const newBtn =
  document.createElement("button");

  newBtn.className =
  "new-form-btn";

  newBtn.textContent =
  "📝 New Form Filling";

  newBtn.onclick =
  startNewForm;

  options.appendChild(
    newBtn
  );

  saveChat();

}


/* =========================
   START NEW FORM
========================= */

function startNewForm(){

  if(statusCheckTimer){

    clearInterval(
      statusCheckTimer
    );

    statusCheckTimer =
    null;

  }


  /*
    पुराना Chat/History DELETE नहीं होगा।
    केवल Current Form की जानकारी Reset होगी।
  */

  currentSubmissionId =
  null;

  localStorage.removeItem(
    SUBMISSION_ID_KEY
  );

  localStorage.removeItem(
    STATUS_SHOWN_KEY
  );


  data = {

    form_type:"",
    category:"",
    semester:"",
    mobile_number:"",
    admit_card_url:"",
    payment_screenshot_url:"",
    status:"Pending"

  };


  step = 1;


  user(
    "📝 New Form Filling"
  );


  bot(
    "🔄 नया Form Filling शुरू करते हैं।"
  );


  bot(
    "कृपया अपना Form Type चुनें:"
  );


  buttons([

    {
      text:"1️⃣ Backlog Form",

      action:() =>
      chooseType("Backlog Form")

    },

    {
      text:"2️⃣ Regular Form",

      action:() =>
      chooseType("Regular Form")

    }

  ]);


  saveChat();

}


/* =========================
   RESTORE CHAT
========================= */

function restoreChat(){

  const saved =
  localStorage.getItem(
    STORAGE_KEY
  );

  if(!saved){

    start();

    return;

  }


  try{

    const parsed =
    JSON.parse(saved);


    step =
    parsed.step || 1;


    currentSubmissionId =
    parsed.currentSubmissionId
    || null;


    if(parsed.data){

      data =
      parsed.data;

    }


    if(parsed.messages){

      messages.innerHTML =
      parsed.messages;

    }


    /*
      अगर Current Submission ID
      localStorage में है तो उसे
      प्राथमिकता दें।
    */

    const savedId =
    localStorage.getItem(
      SUBMISSION_ID_KEY
    );

    if(savedId){

      currentSubmissionId =
      Number(savedId);

    }


    restoreCurrentStep();

    scrollBottom();


  }catch(error){

    console.error(
      "Restore error:",
      error
    );

    start();

  }

}


/* =========================
   RESTORE CURRENT STEP
========================= */

function restoreCurrentStep(){

  clearOptions();

  inputArea.style.display =
  "none";


  /* STEP 1 */

  if(step === 1){

    buttons([

      {
        text:"1️⃣ Backlog Form",

        action:() =>
        chooseType("Backlog Form")

      },

      {
        text:"2️⃣ Regular Form",

        action:() =>
        chooseType("Regular Form")

      }

    ]);

    return;

  }


  /* STEP 2 */

  if(
    step === 2 &&
    !data.category
  ){

    buttons([

      {
        text:"1️⃣ Practical Honours",

        action:() =>
        chooseCategory(
          "Practical Honours"
        )

      },

      {
        text:"2️⃣ Non-Practical Honours",

        action:() =>
        chooseCategory(
          "Non-Practical Honours"
        )

      }

    ]);

    return;

  }


  /* SEMESTER */

  if(
    step === 2 &&
    data.category
  ){

    const semesterButtons = [];

    for(let i=1;i<=8;i++){

      semesterButtons.push({

        text:"Semester " + i,

        action:() =>
        chooseSemester(
          "Semester " + i
        )

      });

    }

    buttons(
      semesterButtons
    );

    return;

  }


  /* ADMIT CARD */

  if(
    step === 4
  ){

    showAdmitUpload();

    return;

  }


  /* MOBILE */

  if(
    step === 3
  ){

    showMobileInput();

    return;

  }


  /* PAYMENT */

  if(
    step === 5
  ){

    payment();

    return;

  }


  /* SUBMISSION STATUS */

  if(
    step === 6 &&
    currentSubmissionId
  ){

    const shown =
    localStorage.getItem(
      STATUS_SHOWN_KEY
    );


    if(
      data.status === "Done" ||
      shown === "Done"
    ){

      showCompletionOptions();

      return;

    }


    if(
      data.status === "Failed" ||
      shown === "Failed"
    ){

      showNewFormButton();

      return;

    }


    startStatusChecking();

    return;

  }

}


/* =========================
   MOBILE ONLY NUMBERS
========================= */

textInput.addEventListener(
  "input",
  function(){

    this.value =
    this.value
      .replace(/\D/g,"")
      .slice(0,10);

  }
);


/* =========================
   ENTER KEY
========================= */

textInput.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter"
    ){

      sendMobile();

    }

  }
);


/* =========================
   PAGE LOAD
========================= */

restoreChat();

</script>
