<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Filling</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#e5ddd5;
}

.chat{
  max-width:700px;
  margin:auto;
  min-height:100vh;
  background:#efeae2;
  display:flex;
  flex-direction:column;
}

.header{
  background:#075e54;
  color:white;
  padding:15px;
  font-size:20px;
  font-weight:bold;
}

.messages{
  flex:1;
  padding:15px;
  overflow-y:auto;
}

.msg{
  max-width:85%;
  padding:11px 14px;
  margin:8px 0;
  border-radius:10px;
  line-height:1.4;
  word-wrap:break-word;
}

.bot{
  background:white;
  margin-right:auto;
}

.user{
  background:#dcf8c6;
  margin-left:auto;
}

.options{
  padding:10px;
}

button{
  width:100%;
  padding:13px;
  margin:5px 0;
  border:0;
  border-radius:8px;
  background:#128c7e;
  color:white;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  opacity:.95;
}

.input-area{
  display:flex;
  gap:6px;
  padding:8px;
  background:#f0f0f0;
}

input[type=text]{
  flex:1;
  padding:13px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

.send{
  width:auto;
  padding:0 18px;
}

.file-label{
  display:block;
  background:#128c7e;
  color:white;
  text-align:center;
  padding:13px;
  border-radius:8px;
  cursor:pointer;
  margin-top:8px;
}

input[type=file]{
  display:none;
}

.hidden{
  display:none;
}

.qr-box{
  background:white;
  margin:10px 0;
  padding:15px;
  border-radius:10px;
  text-align:center;
}

.qr-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:10px;
}

.qr-amount{
  font-size:20px;
  font-weight:bold;
  margin-bottom:12px;
}

.qr-image{
  width:100%;
  max-width:300px;
  height:auto;
  display:block;
  margin:0 auto;
  border-radius:6px;
}

.receipt-button{
  display:block;
  width:100%;
  padding:13px;
  margin-top:10px;
  border-radius:8px;
  background:#128c7e;
  color:white;
  text-align:center;
  text-decoration:none;
  font-size:16px;
  font-weight:bold;
}

.status-message{
  background:white;
  padding:14px;
  border-radius:10px;
  margin:10px 0;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="chat">

  <div class="header">Form Filling</div>

  <div class="messages" id="messages"></div>

  <div class="options" id="options"></div>

  <div class="input-area" id="textArea">
    <input
      type="text"
      id="textInput"
      placeholder="Type here..."
    >

    <button
      class="send"
      onclick="sendText()"
    >
      Send
    </button>
  </div>

</div>

<script>

const SUPABASE_URL =
"https://aghizlgvrhunpuxvohep.supabase.co";

const SUPABASE_KEY =
"sb_publishable_gpc7KUqUIykO3WM1aCzRfg_Myo8AKyx";


/*
  जब आपका Receipt Download Link तैयार हो जाए,
  केवल नीचे की value में वह link डालना होगा।
*/
const RECEIPT_LINK = "";


const messages =
document.getElementById("messages");

const options =
document.getElementById("options");

const textArea =
document.getElementById("textArea");

const textInput =
document.getElementById("textInput");


let step = 1;

let statusCheckTimer = null;

let currentSubmissionId = null;


let data = {

  form_type:"",
  category:"",
  semester:"",
  mobile_number:"",
  admit_card_url:"",
  payment_screenshot_url:"",
  status:"Pending"

};



function bot(text){

  const div =
  document.createElement("div");

  div.className =
  "msg bot";

  div.textContent =
  text;

  messages.appendChild(div);

  messages.scrollTop =
  messages.scrollHeight;

}



function user(text){

  const div =
  document.createElement("div");

  div.className =
  "msg user";

  div.textContent =
  text;

  messages.appendChild(div);

  messages.scrollTop =
  messages.scrollHeight;

}



function buttons(items){

  options.innerHTML = "";

  textArea.style.display = "none";


  items.forEach(item=>{

    const b =
    document.createElement("button");

    b.textContent =
    item.text;

    b.onclick =
    ()=>item.action();

    options.appendChild(b);

  });

}



function textMode(placeholder){

  options.innerHTML = "";

  textArea.style.display =
  "flex";

  textInput.placeholder =
  placeholder;

  textInput.value = "";

  textInput.focus();

}



function sendText(){

  const value =
  textInput.value.trim();

  if(!value)return;


  if(step===3){

    const n =
    value.replace(/\D/g,"");


    if(n.length!==10){

      bot(
        "कृपया केवल 10 अंकों का मोबाइल नंबर दर्ज करें।"
      );

      return;
    }


    data.mobile_number =
    n;

    user(n);

    payment();

  }

}



function start(){

  bot(
    "Backlog Form भरने के लिए 1 दबाएँ और Regular Form भरने के लिए 2 दबाएँ।"
  );


  buttons([

    {
      text:"1 - Backlog Form",
      action:()=>chooseType("Backlog")
    },

    {
      text:"2 - Regular Form",
      action:()=>chooseType("Regular")
    }

  ]);

}



function chooseType(type){

  data.form_type =
  type;

  user(type);


  bot(
    "Practical Honours के लिए 1 दबाएँ, Non-Practical Honours के लिए 2 दबाएँ।"
  );


  buttons([

    {
      text:"1 - Practical Honours",
      action:()=>chooseCategory("Practical")
    },

    {
      text:"2 - Non-Practical Honours",
      action:()=>chooseCategory("Non-Practical")
    }

  ]);

}



function chooseCategory(category){

  data.category =
  category;

  user(category);


  bot(
    "आपको जिस Semester का Form Fill करना है, उसे Select करें।"
  );


  buttons([

    {
      text:"Semester 1",
      action:()=>chooseSemester(1)
    },

    {
      text:"Semester 2",
      action:()=>chooseSemester(2)
    },

    {
      text:"Semester 3",
      action:()=>chooseSemester(3)
    },

    {
      text:"Semester 4",
      action:()=>chooseSemester(4)
    },

    {
      text:"Semester 5",
      action:()=>chooseSemester(5)
    },

    {
      text:"Semester 6",
      action:()=>chooseSemester(6)
    },

    {
      text:"Semester 7",
      action:()=>chooseSemester(7)
    },

    {
      text:"Semester 8",
      action:()=>chooseSemester(8)
    }

  ]);

}



function chooseSemester(s){

  data.semester =
  "Semester "+s;

  user(data.semester);


  bot(
    "कृपया अपना Admit Card भेजें।"
  );


  options.innerHTML = "";


  const label =
  document.createElement("label");

  label.className =
  "file-label";

  label.textContent =
  "📎 Admit Card Upload";


  const input =
  document.createElement("input");

  input.type =
  "file";

  input.accept =
  "image/*,.pdf";


  input.onchange =
  ()=>{

    if(input.files.length){

      uploadFile(
        input.files[0],
        "admit"
      );

    }

  };


  label.appendChild(input);

  options.appendChild(label);

}



async function uploadFile(file,type){

  bot(
    "File upload हो रहा है, कृपया प्रतीक्षा करें..."
  );


  const path =
  Date.now()+
  "_"+
  Math.random()
  .toString(36)
  .substring(2)+
  "_"+
  file.name;


  try{

    const response =
    await fetch(

      SUPABASE_URL+
      "/storage/v1/object/form-filling-files/"+
      path,

      {
        method:"POST",

        headers:{

          "apikey":
          SUPABASE_KEY,

          "Content-Type":
          file.type ||
          "application/octet-stream"

        },

        body:file

      }

    );


    if(!response.ok){

      const errorText =
      await response.text();

      console.error(
        "File Upload Error:",
        response.status,
        errorText
      );

      bot(
        "File upload नहीं हो पाया। कृपया दोबारा कोशिश करें।"
      );

      return;
    }


    const url =
    SUPABASE_URL+
    "/storage/v1/object/public/form-filling-files/"+
    path;


    if(type==="admit"){

      data.admit_card_url =
      url;

      user(
        "Admit Card भेज दिया गया"
      );


      bot(
        "अब अपना NPU Registered Mobile Number दर्ज करें।"
      );


      step = 3;

      textMode(
        "10 digit mobile number"
      );

    }


    if(type==="payment"){

      data.payment_screenshot_url =
      url;

      user(
        "Payment Screenshot भेज दिया गया"
      );

      await submitForm();

    }

  }
  catch(error){

    console.error(
      "File Upload Error:",
      error
    );

    bot(
      "File upload नहीं हो पाया। कृपया दोबारा कोशिश करें।"
    );

  }

}



function payment(){

  const amount =
  data.category==="Practical"
  ? "₹775"
  : "₹625";


  const qrFile =
  data.category==="Practical"
  ? "qr775.png"
  : "qr625.png";


  bot(
    "आपको "+amount+
    " का Payment करना है। नीचे दिए गए QR को Scan करके Payment करें और Payment Screenshot Upload करें।"
  );


  const qrBox =
  document.createElement("div");

  qrBox.className =
  "qr-box";


  const title =
  document.createElement("div");

  title.className =
  "qr-title";

  title.textContent =
  "💳 PAYMENT QR";

  qrBox.appendChild(title);


  const amountText =
  document.createElement("div");

  amountText.className =
  "qr-amount";

  amountText.textContent =
  amount;

  qrBox.appendChild(amountText);


  const qrImage =
  document.createElement("img");

  qrImage.className =
  "qr-image";

  qrImage.src =
  qrFile;

  qrImage.alt =
  "Payment QR Code";


  qrImage.onerror =
  ()=>{

    qrBox.innerHTML = "";

    const error =
    document.createElement("div");

    error.className =
    "qr-title";

    error.textContent =
    "QR Code दिखाई नहीं दे रहा है। कृपया बाद में पुनः प्रयास करें।";

    qrBox.appendChild(error);

  };


  qrBox.appendChild(qrImage);

  messages.appendChild(qrBox);

  messages.scrollTop =
  messages.scrollHeight;


  options.innerHTML = "";


  const label =
  document.createElement("label");

  label.className =
  "file-label";

  label.textContent =
  "📷 Payment Screenshot Upload";


  const input =
  document.createElement("input");

  input.type =
  "file";

  input.accept =
  "image/*,.pdf";


  input.onchange =
  ()=>{

    if(input.files.length){

      uploadFile(
        input.files[0],
        "payment"
      );

    }

  };


  label.appendChild(input);

  options.appendChild(label);

  textArea.style.display =
  "none";

}



async function submitForm(){

  /*
    यह message केवल submission process शुरू होने पर
    दिखेगा। अगर Supabase में submission सफल होता है,
    तो कोई failure message नहीं दिखाया जाएगा।
  */

  bot(
    "आपकी सारी जानकारी सफलतापूर्वक प्राप्त कर ली गई है। Verification एवं Form Filling तक कृपया प्रतीक्षा करें।"
  );


  try{

    const response =
    await fetch(

      SUPABASE_URL+
      "/rest/v1/form_filling_submissions",

      {

        method:"POST",

        headers:{

          "apikey":
          SUPABASE_KEY,

          "Content-Type":
          "application/json",

          "Prefer":
          "return=representation"

        },

        body:
        JSON.stringify(data)

      }

    );


    if(!response.ok){

      const errorText =
      await response.text();

      console.error(
        "Form Submission Error:",
        response.status,
        errorText
      );

      /*
        केवल वास्तविक database submission failure
        होने पर यह message दिखेगा।
      */

      bot(
        "जानकारी जमा करने में समस्या हुई। कृपया दोबारा प्रयास करें।"
      );

      return;

    }


    const result =
    await response.json();


    console.log(
      "Submission Result:",
      result
    );


    if(
      !result ||
      !result[0] ||
      !result[0].id
    ){

      console.error(
        "Submission ID नहीं मिला:",
        result
      );

      /*
        Submission सफल हो चुकी हो सकती है,
        इसलिए user को failure message नहीं दिखाएँगे।
        Status tracking उपलब्ध न होने की स्थिति में
        केवल console में error रहेगा।
      */

      options.innerHTML = "";

      textArea.style.display =
      "none";

      return;

    }


    currentSubmissionId =
    result[0].id;


    localStorage.setItem(
      "formFillingSubmissionId",
      currentSubmissionId
    );


    /*
      नया submission शुरू होने पर पुराने status
      notification को reset करें।
    */

    localStorage.removeItem(
      "formFillingStatusShown"
    );


    options.innerHTML = "";

    textArea.style.display =
    "none";


    startStatusChecking();

  }
  catch(error){

    console.error(
      "Form Submission Error:",
      error
    );

    /*
      Network/technical error होने पर ही
      failure message दिखेगा।
    */

    bot(
      "जानकारी जमा करने में समस्या हुई। कृपया दोबारा प्रयास करें।"
    );

  }

}



function startStatusChecking(){

  if(statusCheckTimer){

    clearInterval(
      statusCheckTimer
    );

  }


  checkSubmissionStatus();


  statusCheckTimer =
  setInterval(
    checkSubmissionStatus,
    5000
  );

}



async function checkSubmissionStatus(){

  if(!currentSubmissionId){

    currentSubmissionId =
    localStorage.getItem(
      "formFillingSubmissionId"
    );

  }


  if(!currentSubmissionId){

    return;
  }


  try{

    /*
      Supabase RPC function:
      get_form_filling_status(bigint)

      इसमें केवल id और status वापस आता है।
    */

    const response =
    await fetch(

      SUPABASE_URL+
      "/rest/v1/rpc/get_form_filling_status",

      {

        method:"POST",

        headers:{

          "apikey":
          SUPABASE_KEY,

          "Content-Type":
          "application/json"

        },

        body:
        JSON.stringify({

          submission_id:
          Number(currentSubmissionId)

        })

      }

    );


    if(!response.ok){

      const errorText =
      await response.text();

      console.error(
        "Status Check Error:",
        response.status,
        errorText
      );

      return;

    }


    const result =
    await response.json();


    if(
      !result ||
      !result[0]
    ){

      return;

    }


    const status =
    result[0].status;


    if(status==="Done"){

      if(
        localStorage.getItem(
          "formFillingStatusShown"
        )!=="Done"
      ){

        bot(
          "✅ Verification Done हो गया है।"
        );


        localStorage.setItem(
          "formFillingStatusShown",
          "Done"
        );


        showReceiptButton();

      }


      if(statusCheckTimer){

        clearInterval(
          statusCheckTimer
        );

      }

    }


    if(status==="Failed"){

      if(
        localStorage.getItem(
          "formFillingStatusShown"
        )!=="Failed"
      ){

        bot(
          "❌ कृपया सही डॉक्यूमेंट अपलोड करें और फिर से प्रयास करें। कृपया फिर से सही डॉक्यूमेंट एवं सही पेमेंट का स्क्रीनशॉट अपलोड करें और पुनः प्रयास करें।"
        );


        localStorage.setItem(
          "formFillingStatusShown",
          "Failed"
        );

      }


      if(statusCheckTimer){

        clearInterval(
          statusCheckTimer
        );

      }

    }

  }
  catch(error){

    console.error(
      "Status Check Error:",
      error
    );

  }

}



function showReceiptButton(){

  options.innerHTML = "";

  textArea.style.display =
  "none";


  /*
    Receipt link अभी खाली है।
    Link मिलने के बाद RECEIPT_LINK में डालना होगा।
  */

  if(RECEIPT_LINK){

    const link =
    document.createElement("a");

    link.className =
    "receipt-button";

    link.href =
    RECEIPT_LINK;

    link.target =
    "_blank";

    link.rel =
    "noopener noreferrer";

    link.textContent =
    "📄 Download Receipt";

    options.appendChild(link);

  }

}



start();

</script>

</body>
</html>
