<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Portal Login</title>

<link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#0d47a1">

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{

    font-family:Arial, sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;

    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            #ff9933 0%,
            #ffffff 35%,
            #ffffff 65%,
            #138808 100%
        );

    position:relative;
}


/* MIRROR REFLECTION EFFECT */

body::before{

    content:"";

    position:absolute;

    top:-50%;
    left:-50%;

    width:200%;
    height:200%;

    background:
        linear-gradient(
            120deg,
            transparent 40%,
            rgba(255,255,255,0.45) 50%,
            transparent 60%
        );

    transform:rotate(0deg);

    animation:mirrorMove 6s linear infinite;

    pointer-events:none;
}


@keyframes mirrorMove{

    0%{
        transform:translateX(-30%) rotate(0deg);
    }

    50%{
        transform:translateX(30%) rotate(0deg);
    }

    100%{
        transform:translateX(-30%) rotate(0deg);
    }

}


/* LOGIN BOX */

.login-box{

    width:90%;
    max-width:400px;

    background:#ffffff;

    padding:30px 25px;

    border-radius:20px;

    box-shadow:
        0 10px 35px rgba(0,0,0,0.25);

    position:relative;

    z-index:10;

    text-align:center;
}


/* TITLE */

.login-box h2{

    margin-top:0;
    margin-bottom:25px;

    color:#0d47a1;

    font-size:28px;

}


/* INPUT */

.login-box input{

    width:100%;

    padding:14px;

    margin-bottom:15px;

    border:1px solid #ccc;

    border-radius:10px;

    font-size:16px;

    outline:none;
}


.login-box input:focus{

    border-color:#0d47a1;

    box-shadow:
        0 0 5px rgba(13,71,161,0.25);

}


/* LOGIN BUTTON */

.login-btn{

    width:100%;

    padding:14px;

    border:none;

    border-radius:10px;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    background:
        linear-gradient(
            to right,
            #ff9933,
            #ffffff,
            #138808
        );

    color:#000;

    transition:0.3s;
}


.login-btn:hover{

    transform:scale(1.02);

}


.login-btn:disabled{

    opacity:0.6;

    cursor:not-allowed;

    transform:none;
}


/* DOWNLOAD BUTTON */

.download-btn{

    width:100%;

    padding:14px;

    margin-top:14px;

    border:none;

    border-radius:10px;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    /* EXACT SAME COLOR AS LOGIN BUTTON */

    background:
        linear-gradient(
            to right,
            #ff9933,
            #ffffff,
            #138808
        );

    color:#000;

    transition:0.3s;

    display:none;
}


.download-btn:hover{

    transform:scale(1.02);

}


.download-btn:disabled{

    opacity:0.6;

    cursor:not-allowed;

    transform:none;

}


/* MESSAGE */

#message{

    margin-top:15px;

    font-size:14px;

    font-weight:bold;

    min-height:20px;

}


/* MOBILE */

@media(max-width:500px){

    .login-box{

        padding:25px 20px;

    }

    .login-box h2{

        font-size:25px;

    }

}

</style>
</head>


<body>


<div class="login-box">

    <h2>Student Portal Login</h2>


    <input
        type="text"
        id="name"
        placeholder="Enter Your Name"
        autocomplete="name"
    >


    <input
        type="tel"
        id="mobile"
        placeholder="Enter 10 Digit Mobile Number"
        maxlength="10"
        inputmode="numeric"
        autocomplete="tel"
    >


    <button
        class="login-btn"
        id="loginBtn"
        type="button"
        onclick="loginUser()"
    >
        Login
    </button>


    <button
        class="download-btn"
        id="downloadBtn"
        type="button"
        onclick="downloadAndOpen()"
    >
        ⬇ Download App
    </button>


    <div id="message"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://aghizlgvrhunpuxvohep.supabase.co";

const SUPABASE_KEY =
"sb_publishable_gpc7KUqUIykO3WM1aCzRfg_Myo8AKyx";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ================================
   PWA INSTALL PROMPT
================================ */

let deferredPrompt = null;


window.addEventListener(
    "beforeinstallprompt",
    function(event){

        event.preventDefault();

        deferredPrompt = event;

        console.log(
            "PWA install prompt ready"
        );

    }
);


/* ================================
   LOGIN
================================ */

async function loginUser(){

    const name =
        document.getElementById("name")
        .value.trim();

    const mobile =
        document.getElementById("mobile")
        .value.trim();

    const loginBtn =
        document.getElementById("loginBtn");

    const downloadBtn =
        document.getElementById("downloadBtn");

    const message =
        document.getElementById("message");


    /* NAME CHECK */

    if(!name){

        message.style.color="red";

        message.textContent =
            "Please enter your name.";

        return;
    }


    /* MOBILE CHECK */

    if(!/^[0-9]{10}$/.test(mobile)){

        message.style.color="red";

        message.textContent =
            "Please enter a valid 10 digit mobile number.";

        return;
    }


    loginBtn.disabled=true;

    loginBtn.textContent="Logging in...";

    message.style.color="#0d47a1";

    message.textContent="Please wait...";


    try{

        /* DEVICE ID */

        let deviceId =
            localStorage.getItem(
                "student_portal_device_id"
            );


        if(!deviceId){

            deviceId =
                crypto.randomUUID();

            localStorage.setItem(
                "student_portal_device_id",
                deviceId
            );

        }


        /* SAVE LOGIN */

        const { error } =
            await supabaseClient.rpc(
                "save_app_login",
                {
                    p_device_id:deviceId,
                    p_name:name,
                    p_mobile:mobile
                }
            );


        if(error){

            throw error;

        }


        /* SAVE LOCAL LOGIN */

        localStorage.setItem(
            "student_portal_name",
            name
        );

        localStorage.setItem(
            "student_portal_mobile",
            mobile
        );

        localStorage.setItem(
            "student_portal_logged_in",
            "true"
        );


        /* LOGIN SUCCESS */

        loginBtn.textContent =
            "Login Successful ✓";

        message.style.color="green";

        message.textContent =
            "Login successful. अब App Download करें।";


        /* SHOW DOWNLOAD BUTTON */

        downloadBtn.style.display =
            "block";


    }catch(error){

        console.error(
            "Login Error:",
            error
        );

        loginBtn.disabled=false;

        loginBtn.textContent="Login";

        message.style.color="red";

        message.textContent =
            error.message ||
            "Login failed. Please try again.";

    }

}


/* ================================
   DOWNLOAD / INSTALL APP
================================ */

async function downloadAndOpen(){

    const downloadBtn =
        document.getElementById("downloadBtn");

    const message =
        document.getElementById("message");


    /*
       Native PWA install prompt
    */

    if(!deferredPrompt){

        message.style.color="#d35400";

        message.textContent =
            "Install option अभी उपलब्ध नहीं है। Browser menu से Install App / Add to Home Screen चुनें।";

        return;

    }


    downloadBtn.disabled=true;

    downloadBtn.textContent =
        "Downloading / Installing...";


    try{

        /* OPEN NATIVE INSTALL POPUP */

        deferredPrompt.prompt();


        const result =
            await deferredPrompt.userChoice;


        if(result.outcome === "accepted"){

            message.style.color="green";

            message.textContent =
                "App install हो रहा है...";

        }else{

            message.style.color="#d35400";

            message.textContent =
                "App installation cancelled.";

            downloadBtn.disabled=false;

            downloadBtn.textContent =
                "⬇ Download App";

        }


        deferredPrompt=null;


    }catch(error){

        console.error(
            "Install Error:",
            error
        );

        message.style.color="red";

        message.textContent =
            "App installation शुरू नहीं हो सकी।";

        downloadBtn.disabled=false;

        downloadBtn.textContent =
            "⬇ Download App";

    }

}


/* ================================
   APP INSTALLED
================================ */

window.addEventListener(
    "appinstalled",
    function(){

        const downloadBtn =
            document.getElementById(
                "downloadBtn"
            );

        const message =
            document.getElementById(
                "message"
            );


        downloadBtn.textContent =
            "✓ App Installed";

        downloadBtn.disabled=true;


        message.style.color="green";

        message.textContent =
            "App successfully installed. Opening App...";


        /*
           Installation complete होने के बाद
           Portal खोलें
        */

        setTimeout(
            function(){

                window.location.href =
                    "./index.html";

            },
            1000
        );

    }
);


/* ================================
   SERVICE WORKER
================================ */

if("serviceWorker" in navigator){

    window.addEventListener(
        "load",
        function(){

            navigator.serviceWorker
                .register(
                    "./service-worker.js"
                )
                .then(function(){

                    console.log(
                        "Service Worker Registered"
                    );

                })
                .catch(function(error){

                    console.log(
                        "Service Worker Error:",
                        error
                    );

                });

        }
    );

}

</script>


</body>
</html>
