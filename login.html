<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             minimum-scale=1.0,
             user-scalable=no"
>

<title>Student Portal Login</title>

<link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#0d47a1">

<style>

/* ================================
   PAGE LOCK
================================ */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{

    width:100%;
    height:100%;

    margin:0;
    padding:0;

    overflow:hidden;

    overscroll-behavior:none;

    touch-action:pan-y;

}

body{

    font-family:Arial, sans-serif;

    position:fixed;

    inset:0;

    width:100vw;
    height:100vh;

    min-width:320px;

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            #ff9933 0%,
            #ffffff 35%,
            #ffffff 65%,
            #138808 100%
        );
}


/* ================================
   MIRROR REFLECTION
================================ */

body::before{

    content:"";

    position:absolute;

    width:200%;
    height:200%;

    top:-50%;
    left:-50%;

    background:
        linear-gradient(
            120deg,
            transparent 40%,
            rgba(255,255,255,0.45) 50%,
            transparent 60%
        );

    animation:
        mirrorMove 6s linear infinite;

    pointer-events:none;

    z-index:1;

}


@keyframes mirrorMove{

    0%{
        transform:
            translateX(-30%);
    }

    50%{
        transform:
            translateX(30%);
    }

    100%{
        transform:
            translateX(-30%);
    }

}


/* ================================
   LOGIN BOX
================================ */

.login-box{

    position:relative;

    z-index:10;

    width:min(90vw, 420px);

    min-height:350px;

    padding:35px 30px;

    background:#ffffff;

    border-radius:20px;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,0.28);

    text-align:center;

    flex-shrink:0;

}


/* ================================
   TITLE
================================ */

.login-box h2{

    margin:

        0
        0
        28px
        0;

    color:#0d47a1;

    font-size:28px;

    line-height:1.25;

}


/* ================================
   INPUT
================================ */

.login-box input{

    display:block;

    width:100%;

    height:52px;

    padding:

        0
        14px;

    margin:

        0
        0
        16px
        0;

    border:

        1px solid
        #cccccc;

    border-radius:10px;

    background:#ffffff;

    font-size:16px;

    color:#222;

    outline:none;

    -webkit-appearance:none;

}


.login-box input:focus{

    border-color:#0d47a1;

    box-shadow:
        0 0 5px
        rgba(13,71,161,0.25);

}


/* ================================
   LOGIN BUTTON
================================ */

.login-btn{

    display:block;

    width:100%;

    height:52px;

    padding:0;

    margin:0;

    border:none;

    border-radius:10px;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    background:
        linear-gradient(
            to right,
            #ff9933,
            #ffffff,
            #138808
        );

    color:#000000;

    transition:transform 0.2s;

}


.login-btn:hover{

    transform:scale(1.01);

}


.login-btn:disabled{

    opacity:0.6;

    cursor:not-allowed;

    transform:none;

}


/* ================================
   DOWNLOAD BUTTON
================================ */

.download-btn{

    display:none;

    width:100%;

    height:52px;

    padding:0;

    margin:

        14px
        0
        0
        0;

    border:none;

    border-radius:10px;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    /* SAME AS LOGIN BUTTON */

    background:
        linear-gradient(
            to right,
            #ff9933,
            #ffffff,
            #138808
        );

    color:#000000;

    transition:transform 0.2s;

}


.download-btn:hover{

    transform:scale(1.01);

}


.download-btn:disabled{

    opacity:0.6;

    cursor:not-allowed;

    transform:none;

}


/* ================================
   MESSAGE
================================ */

#message{

    width:100%;

    min-height:22px;

    margin-top:16px;

    font-size:14px;

    font-weight:bold;

    line-height:1.4;

    overflow-wrap:break-word;

}


/* ================================
   SMALL MOBILE SCREEN
================================ */

@media(max-width:500px){

    .login-box{

        width:calc(100vw - 32px);

        max-width:420px;

        min-height:350px;

        padding:

            30px
            22px;

        border-radius:18px;

    }

    .login-box h2{

        font-size:25px;

        margin-bottom:25px;

    }

}


/* ================================
   VERY SMALL SCREEN
================================ */

@media(max-height:600px){

    .login-box{

        transform:scale(0.92);

    }

}


/* ================================
   LANDSCAPE MOBILE
================================ */

@media(
    orientation:landscape
){

    .login-box{

        max-height:94vh;

        overflow:hidden;

        padding:

            20px
            25px;

    }

    .login-box h2{

        margin-bottom:16px;

        font-size:24px;

    }

    .login-box input{

        height:46px;

        margin-bottom:10px;

    }

    .login-btn,
    .download-btn{

        height:46px;

    }

    #message{

        margin-top:10px;

    }

}

</style>

</head>


<body>


<div class="login-box">

    <h2>
        Student Portal Login
    </h2>


    <input
        type="text"
        id="name"
        placeholder="Enter Your Name"
        autocomplete="name"
    >


    <input
        type="tel"
        id="mobile"
        placeholder="Enter 10 Digit Mobile Number"
        maxlength="10"
        inputmode="numeric"
        autocomplete="tel"
    >


    <button
        class="login-btn"
        id="loginBtn"
        type="button"
        onclick="loginUser()"
    >
        Login
    </button>


    <button
        class="download-btn"
        id="downloadBtn"
        type="button"
        onclick="downloadAndOpen()"
    >
        ⬇ Download S.P.D.D.C
    </button>


    <div id="message"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://aghizlgvrhunpuxvohep.supabase.co";

const SUPABASE_KEY =
"sb_publishable_gpc7KUqUIykO3WM1aCzRfg_Myo8AKyx";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ================================
   PWA INSTALL PROMPT
================================ */

let deferredPrompt = null;


window.addEventListener(
    "beforeinstallprompt",
    function(event){

        event.preventDefault();

        deferredPrompt = event;

        console.log(
            "PWA install prompt ready"
        );

    }
);


/* ================================
   LOGIN
================================ */

async function loginUser(){

    const name =
        document
        .getElementById("name")
        .value
        .trim();

    const mobile =
        document
        .getElementById("mobile")
        .value
        .trim();

    const loginBtn =
        document
        .getElementById("loginBtn");

    const downloadBtn =
        document
        .getElementById("downloadBtn");

    const message =
        document
        .getElementById("message");


    if(!name){

        message.style.color="red";

        message.textContent =
            "Please enter your name.";

        return;

    }


    if(!/^[0-9]{10}$/.test(mobile)){

        message.style.color="red";

        message.textContent =
            "Please enter a valid 10 digit mobile number.";

        return;

    }


    loginBtn.disabled=true;

    loginBtn.textContent=
        "Logging in...";

    message.style.color=
        "#0d47a1";

    message.textContent=
        "Please wait...";


    try{

        /* DEVICE ID */

        let deviceId =
            localStorage.getItem(
                "student_portal_device_id"
            );


        if(!deviceId){

            deviceId =
                crypto.randomUUID();

            localStorage.setItem(
                "student_portal_device_id",
                deviceId
            );

        }


        /* SAVE LOGIN */

        const { error } =
            await supabaseClient.rpc(
                "save_app_login",
                {
                    p_device_id:deviceId,
                    p_name:name,
                    p_mobile:mobile
                }
            );


        if(error){

            throw error;

        }


        /* LOCAL LOGIN */

        localStorage.setItem(
            "student_portal_name",
            name
        );

        localStorage.setItem(
            "student_portal_mobile",
            mobile
        );

        localStorage.setItem(
            "student_portal_logged_in",
            "true"
        );


        /* SUCCESS */

        loginBtn.textContent=
            "Login Successful ✓";


        message.style.color=
            "green";

        message.textContent=
            "Login successful. अब App Download करें।";


        /* SHOW DOWNLOAD */

        downloadBtn.style.display=
            "block";


    }catch(error){

        console.error(
            "Login Error:",
            error
        );


        loginBtn.disabled=
            false;

        loginBtn.textContent=
            "Login";


        message.style.color=
            "red";

        message.textContent=
            error.message ||
            "Login failed. Please try again.";

    }

}


/* ================================
   DOWNLOAD / INSTALL
================================ */

async function downloadAndOpen(){

    const downloadBtn =
        document
        .getElementById("downloadBtn");

    const message =
        document
        .getElementById("message");


    if(!deferredPrompt){

        message.style.color=
            "#d35400";

        message.textContent=
            "Install option अभी उपलब्ध नहीं है। Browser menu से Install App / Add to Home Screen चुनें।";

        return;

    }


    downloadBtn.disabled=
        true;

    downloadBtn.textContent=
        "Downloading / Installing...";


    try{

        deferredPrompt.prompt();


        const result =
            await deferredPrompt.userChoice;


        if(result.outcome === "accepted"){

            message.style.color=
                "green";

            message.textContent=
                "App install हो रहा है...";

        }else{

            message.style.color=
                "#d35400";

            message.textContent=
                "App installation cancelled.";

            downloadBtn.disabled=
                false;

            downloadBtn.textContent=
                "⬇ Download App";

        }


        deferredPrompt=null;


    }catch(error){

        console.error(
            "Install Error:",
            error
        );


        message.style.color=
            "red";

        message.textContent=
            "App installation शुरू नहीं हो सकी।";


        downloadBtn.disabled=
            false;

        downloadBtn.textContent=
            "⬇ Download App";

    }

}


/* ================================
   APP INSTALLED
================================ */

window.addEventListener(
    "appinstalled",
    function(){

        const downloadBtn =
            document
            .getElementById("downloadBtn");

        const message =
            document
            .getElementById("message");


        downloadBtn.textContent=
            "✓ App Installed";

        downloadBtn.disabled=
            true;


        message.style.color=
            "green";

        message.textContent=
            "App successfully installed. Opening App...";


        setTimeout(
            function(){

                window.location.href=
                    "./index.html";

            },
            1000
        );

    }
);


/* ================================
   SERVICE WORKER
================================ */

if(
    "serviceWorker"
    in navigator
){

    window.addEventListener(
        "load",
        function(){

            navigator
                .serviceWorker
                .register(
                    "./service-worker.js"
                )
                .then(
                    function(){

                        console.log(
                            "Service Worker Registered"
                        );

                    }
                )
                .catch(
                    function(error){

                        console.log(
                            "Service Worker Error:",
                            error
                        );

                    }
                );

        }
    );

}

</script>


</body>
</html>
