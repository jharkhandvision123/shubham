<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SPDD College - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;

      background:
        linear-gradient(
          to bottom,
          #ff9933 0%,
          #ff9933 33.33%,
          #ffffff 33.33%,
          #ffffff 66.66%,
          #138808 66.66%,
          #138808 100%
        );
    }

    .login-box {
      width: 90%;
      max-width: 400px;
      background: rgba(255,255,255,0.97);
      border-radius: 22px;
      padding: 30px 25px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.20);
    }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      border-radius: 50%;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 27px;
      color: #0d47a1;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 16px;
      color: #555;
      margin-bottom: 25px;
    }

    .input-box {
      width: 100%;
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 2px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #0d47a1;
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;

      background: linear-gradient(
        to right,
        #ff9933,
        #ffffff,
        #138808
      );

      color: #111;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid #ddd;
    }

    .login-btn:active {
      transform: scale(0.98);
    }

    .message {
      margin-top: 15px;
      font-size: 14px;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <img
      src="./images/app-icon-192.png.jpeg"
      alt="SPDD College Logo"
      class="logo"
    >

    <h1>SPDD College</h1>
    <div class="subtitle">Student Portal Login</div>

    <div class="input-box">
      <input
        type="text"
        id="name"
        placeholder="अपना नाम दर्ज करें"
        autocomplete="name"
      >
    </div>

    <div class="input-box">
      <input
        type="tel"
        id="mobile"
        placeholder="10 अंकों का मोबाइल नंबर"
        inputmode="numeric"
        autocomplete="tel"
        maxlength="10"
      >
    </div>

    <button class="login-btn" onclick="loginUser()">
      Login
    </button>

    <div class="message" id="message"></div>

  </div>

  <script>

    // Device ID बनाना/सेव करना
    function getDeviceId() {
      let deviceId = localStorage.getItem("spdd_device_id");

      if (!deviceId) {
        deviceId =
          "device-" +
          Date.now() +
          "-" +
          Math.random().toString(36).substring(2, 15);

        localStorage.setItem("spdd_device_id", deviceId);
      }

      return deviceId;
    }


    function loginUser() {

      const name = document.getElementById("name").value.trim();
      const mobile = document.getElementById("mobile").value.trim();
      const message = document.getElementById("message");


      // Name check
      if (!name) {
        message.style.color = "red";
        message.textContent = "कृपया अपना नाम दर्ज करें।";
        return;
      }


      // Mobile check
      if (!/^[0-9]{10}$/.test(mobile)) {
        message.style.color = "red";
        message.textContent =
          "कृपया सही 10 अंकों का मोबाइल नंबर दर्ज करें।";
        return;
      }


      // Login information save
      localStorage.setItem("spdd_login", "true");
      localStorage.setItem("spdd_user_name", name);
      localStorage.setItem("spdd_user_mobile", mobile);
      localStorage.setItem("spdd_login_time", new Date().toISOString());
      localStorage.setItem("spdd_device_id", getDeviceId());


      message.style.color = "green";
      message.textContent = "Login सफल हो रहा है...";


      // Main portal
      setTimeout(function() {
        window.location.href = "./index.html";
      }, 500);
    }


    // Mobile में केवल numbers
    document.getElementById("mobile").addEventListener(
      "input",
      function() {
        this.value = this.value.replace(/\D/g, "").slice(0, 10);
      }
    );

  </script>

</body>
</html>
